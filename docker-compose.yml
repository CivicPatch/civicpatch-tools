services:
  civicpatch:
    extends:
      file: civicpatch/docker-compose.yml
      service: civicpatch
    networks:
      - civicpatch_net
  api_civicpatch_org:
    extends:
      file: api.civicpatch.org/docker-compose.yml
      service: api_civicpatch_org
    networks:
      - civicpatch_net
  api_civicpatch_org_redis:
    extends:
      file: api.civicpatch.org/docker-compose.yml
      service: api_civicpatch_org_redis
    networks:
      - civicpatch_net
  civicpatch-frontend:
    extends:
      file: civicpatch/docker-compose.yml
      service: civicpatch-frontend
    networks:
      - civicpatch_net
  api_civicpatch_org_db:
    extends:
      file: api.civicpatch.org/docker-compose.yml
      service: api_civicpatch_org_db
    networks:
      - civicpatch_net

  # ── Temporal ───────────────────────────────────────────────────────────────
  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - civicpatch_net
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-admin-tools:
    image: temporalio/admin-tools:1.30.1
    restart: on-failure:6
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - SQL_PASSWORD=temporal
    networks:
      - civicpatch_net
    volumes:
      - ./spike/temporal/scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.30.1
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    networks:
      - civicpatch_net
    volumes:
      - ./spike/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:1.30.1
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    networks:
      - civicpatch_net
    volumes:
      - ./spike/temporal/scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    ports:
      - "8233:8080"
    networks:
      - civicpatch_net
  # ── End Temporal ───────────────────────────────────────────────────────────

networks:
  civicpatch_net:
    driver: bridge

volumes:
  api_civicpatch_org_db_data:
  temporal_db_data:
