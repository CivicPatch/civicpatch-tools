services:
  pipelines:
    extends:
      file: pipelines/docker-compose.yml
      service: pipelines
    networks:
      - civicpatch_net
  civicpatch-org:
    extends:
      file: civicpatch.org/docker-compose.yml
      service: civicpatch-org
    networks:
      - civicpatch_net
  civicpatch-org-redis:
    extends:
      file: civicpatch.org/docker-compose.yml
      service: civicpatch-org-redis
    networks:
      - civicpatch_net
  civicpatch-org-s2:
    extends:
      file: civicpatch.org/docker-compose.yml
      service: civicpatch-org-s2
    networks:
      - civicpatch_net
  # R2 is addressed as <bucket>.<host>, which s2 does not speak: this turns it into s2's /<bucket>/<key>.
  # s2.localhost is one name for containers (the aliases below) and browsers (*.localhost is loopback).
  civicpatch-org-s2-proxy:
    container_name: civicpatch-org-s2-proxy
    image: caddy:2.11.7-alpine
    configs:
      - source: s2_proxy_caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      - "9000:9000"
    depends_on:
      - civicpatch-org-s2
    networks:
      civicpatch_net:
        # The storage endpoint and each bucket's virtual host, as boto3 addresses them.
        aliases:
          - s2.localhost
          - civicpatch-artifacts-nonprod.s2.localhost
          - civicpatch-nonprod.s2.localhost
          - civicpatch-debug-nonprod.s2.localhost

  api-frontend:
    build:
      context: .
      dockerfile: civicpatch.org/Dockerfile
      target: frontend-dev
    ports:
      - "8004:8004"
    volumes:
      - ./civicpatch.org/src/frontend:/app
      # Keeps host node_modules out of the container — the image builds its own,
      # for the container's platform. Named, so a recreate reuses it rather than orphaning a copy.
      - api_frontend_node_modules:/app/node_modules
    # Installed on start, not only at image build. The volume above outlives
    # `compose up`, so a dependency added since it was created is otherwise
    # invisible to the container while resolving fine on the host.
    command: sh -c "npm install && npm start"
    networks:
      - civicpatch_net
  civicpatch-org-db:
    extends:
      file: civicpatch.org/docker-compose.yml
      service: civicpatch-org-db
    networks:
      - civicpatch_net

  civicpatch-org-sinks:
    extends:
      file: civicpatch.org/docker-compose.yml
      service: civicpatch-org-sinks
    networks:
      - civicpatch_net
    # These workers connect to the DB at startup (get_pool) and Temporal — wait for both to be
    # healthy, else main() wedges on a dead pool and never starts polling the task queue.
    # extends does not merge depends_on, so every dependency must be listed here.
    depends_on:
      civicpatch-org-db:
        condition: service_healthy
      civicpatch-org-redis:
        condition: service_started
      temporal:
        condition: service_healthy
    restart: unless-stopped

  civicpatch-org-source:
    extends:
      file: civicpatch.org/docker-compose.yml
      service: civicpatch-org-source
    networks:
      - civicpatch_net
    # These workers connect to the DB at startup (get_pool) and Temporal — wait for both to be
    # healthy, else main() wedges on a dead pool and never starts polling the task queue.
    # extends does not merge depends_on, so every dependency must be listed here.
    depends_on:
      civicpatch-org-db:
        condition: service_healthy
      civicpatch-org-redis:
        condition: service_started
      temporal:
        condition: service_healthy
    restart: unless-stopped

  civicpatch-org-cleanup:
    extends:
      file: civicpatch.org/docker-compose.yml
      service: civicpatch-org-cleanup
    networks:
      - civicpatch_net
    # These workers connect to the DB at startup (get_pool) and Temporal — wait for both to be
    # healthy, else main() wedges on a dead pool and never starts polling the task queue.
    # extends does not merge depends_on, so every dependency must be listed here.
    depends_on:
      civicpatch-org-db:
        condition: service_healthy
      civicpatch-org-redis:
        condition: service_started
      temporal:
        condition: service_healthy
    restart: unless-stopped

  civicpatch-org-maps:
    extends:
      file: civicpatch.org/docker-compose.yml
      service: civicpatch-org-maps
    networks:
      - civicpatch_net
    # These workers connect to the DB at startup (get_pool) and Temporal — wait for both to be
    # healthy, else main() wedges on a dead pool and never starts polling the task queue.
    # extends does not merge depends_on, so every dependency must be listed here.
    depends_on:
      civicpatch-org-db:
        condition: service_healthy
      civicpatch-org-redis:
        condition: service_started
      temporal:
        condition: service_healthy
    restart: unless-stopped

  # ── Scrape worker ──────────────────────────────────────────────────────────
  # The civicpatch-org image, second entrypoint. Its own service rather than a second Worker
  # inside another worker so it keeps the environment below — which is the whole of it.
  # No database, no storage, no sheets: every activity here goes over HTTP.
  civicpatch-org-pipeline-runs:
    container_name: civicpatch-org-pipeline-runs
    image: civicpatch-org-dev
    build:
      context: .
      dockerfile: civicpatch.org/Dockerfile
      target: development
    entrypoint: ["python", "src/workers/pipeline_runs.py"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_ORG: ${GITHUB_ORG:-CivicPatch}
      GITHUB_REPO: ${GITHUB_REPO:-server}
      CIVICPATCH_ORG_URL: http://civicpatch-org:8000
      SERVICE_API_KEY: ${SERVICE_API_KEY:-service-api-key}
      CIVICPATCH_LOCAL_URL: http://pipelines:8001
    volumes:
      - ./civicpatch.org:/app
      - ./shared/src/shared:/app/src/shared
    networks:
      - civicpatch_net
    restart: unless-stopped
    develop:
      watch:
        - path: ./civicpatch.org/src
          action: restart
        - path: ./shared/src/shared
          action: restart

  # ── Temporal ───────────────────────────────────────────────────────────────
  temporal-postgres:
    image: postgres:16
    stop_grace_period: 30s
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - civicpatch_net
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-admin-tools:
    image: ghcr.io/civicpatch/civicpatch_temporal_admin_tools:latest
    build:
      context: ./temporal
      dockerfile: Dockerfile.admin-tools
    restart: on-failure:6
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - SQL_PASSWORD=temporal
    networks:
      - civicpatch_net
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    image: ghcr.io/civicpatch/civicpatch_temporal:latest
    build:
      context: ./temporal
      dockerfile: Dockerfile.temporal
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    networks:
      # Pinned: ringpop membership rows in cluster_membership outlive the
      # container by 2 days, so a reassigned IP makes the next boot try to
      # gossip with a dead address and fail to join.
      civicpatch_net:
        ipv4_address: 172.21.0.250
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    image: ghcr.io/civicpatch/civicpatch_temporal_admin_tools:latest
    build:
      context: ./temporal
      dockerfile: Dockerfile.admin-tools
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    networks:
      - civicpatch_net
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    ports:
      - "8002:8080"
    networks:
      - civicpatch_net
  # ── End Temporal ───────────────────────────────────────────────────────────

networks:
  civicpatch_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

configs:
  s2_proxy_caddyfile:
    content: |
      {
        auto_https off
        admin off
      }
      :9000 {
        @bucket header_regexp bucket Host ^([a-z0-9-]+)\.s2\.localhost(:[0-9]+)?$$
        rewrite @bucket /{re.bucket.1}{uri}
        reverse_proxy civicpatch-org-s2:9000
      }

volumes:
  api_civicpatch_org_db_data:
  temporal_db_data:
  api_frontend_node_modules:
  civicpatch_org_s2_data:
