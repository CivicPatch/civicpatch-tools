[project]
name = "shared"
version = "0.1.0"
description = ""
authors = [
    {name = "michelle@civicpatch.org"}
]
requires-python = ">=3.12"
dependencies = [
    "nameparser (>=1.1.3,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "ruamel-yaml>=0.19.1,<0.20.0",
    "phonenumbers (>=9.0.25,<10.0.0)",
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "deptry (>=0.24.0,<0.25.0) ; python_version >= \"3.12\" and python_version < \"4.0\""
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]