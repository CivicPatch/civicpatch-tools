# Which government forms a jurisdiction may have, by level and by the last word of its
# registry name ("Millbury town" -> "town"). Exactly one allowed form decides it without the
# LLM; several narrow the LLM's choices. A jurisdiction's own government form beats all of it.
#
# Lookup: states.<state>.<level>.<suffix>, then its "*", then country.<level>.<suffix>, then
# country's "*". A state list must be a subset of country's "*" for that level.
country:
  local:
    "*":
      - mayor_council
      - council_manager
      - commission
      - township_board
      - open_town_meeting
      - representative_town_meeting
  counties:
    "*":
      - commission
      - council_manager
      - county_executive

states:
  mi:
    local:
      township: [township_board]
  nd:
    local:
      township: [township_board]
  ma:
    local:
      town: [open_town_meeting, representative_town_meeting]
  tx:
    counties:
      "*": [commission]
  tn:
    counties:
      "*": [county_executive]
  hi:
    counties:
      "*": [county_executive]

# Each state's county titles. The board is in every county form, so a county gets it even before
# its form is known; the executive only under county_executive. A state not listed keeps its
# default organization.
county_governments:
  ca:
    board: {name: Board of Supervisors, role_labels: [Supervisor, Chair, Vice Chair]}
  co:
    board: {name: Board of County Commissioners, role_labels: [Commissioner, Chair]}
  de:
    board: {name: County Council, role_labels: [Council Member, Council President]}
  hi:
    board: {name: County Council, role_labels: [Council Member, Chair, Vice Chair]}
    executive: {name: Office of the Mayor, role_labels: [Mayor]}
  id:
    board: {name: Board of County Commissioners, role_labels: [Commissioner, Chair]}
  ma:
    board: {name: Board of County Commissioners, role_labels: [Commissioner, Chair]}
  me:
    board: {name: Board of County Commissioners, role_labels: [Commissioner, Chair]}
  mi:
    board: {name: Board of Commissioners, role_labels: [Commissioner, Chair, Vice Chair]}
  nc:
    board: {name: Board of Commissioners, role_labels: [Commissioner, Chair, Vice Chair]}
  nd:
    board: {name: Board of County Commissioners, role_labels: [Commissioner, Chair]}
  nh:
    board: {name: Board of Commissioners, role_labels: [Commissioner]}
  nj:
    board: {name: Board of County Commissioners, role_labels: [Commissioner, Chair]}
  nm:
    board: {name: Board of County Commissioners, role_labels: [Commissioner, Chair]}
  sc:
    board: {name: County Council, role_labels: [Council Member, Chair, Vice Chair]}
  tn:
    board: {name: County Commission, role_labels: [Commissioner, Chair]}
    executive: {name: Office of the County Mayor, role_labels: [Mayor]}
  tx:
    board: {name: Commissioners Court, role_labels: [Commissioner]}
  wa:
    board: {name: Board of County Commissioners, role_labels: [Commissioner, Chair]}
