---
designations:
  ward:
    is_unique: false
    is_division: true
    aliases:
      - council ward
      - ward council
  district:
    is_unique: false
    is_division: true
    name: council_district # ocd-diviosion uses council_district
    aliases:
      - council district
      - district council
  precinct:
    is_unique: false
    is_division: true
    aliases: []
  position:
    is_unique: false
    aliases:
      - council position
      - position council
      - posn
      - posn.
      - psn
      - pos
      - pos.
      - position no.
      - position no
  seat:
    is_unique: true
    aliases:
      - council seat
  place:
    is_unique: true
    aliases:
      - council place
  post:
    is_unique: true
    is_division: false
    aliases: []
  at-large:
    is_unique: false
    # The only keyword that means something on its own: "at-large" *is* the answer, where
    # "ward" without a value is just a word. Everything else needs a value to be a
    # designation at all.
    is_valueless: true
    aliases: 
      - citywide
      - city-wide
      - at large
      - city wide
