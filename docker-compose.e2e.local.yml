# Local development override for the e2e stack.
# Mounts the locally-built frontend assets into the app container so you
# don't need to rebuild the Docker image after frontend changes.
#
# Usage (handled automatically by `mise run e2e` / `mise run visual`):
#   docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.local.yml up ...
services:
  civicpatch-org-e2e:
    volumes:
      - ./civicpatch.org/src/frontend/build:/app/src/frontend/build:ro
      - ./civicpatch.org/src/frontend/css:/app/src/frontend/css:ro
      - ./civicpatch.org/src/frontend/fonts:/app/src/frontend/fonts:ro
      - ./civicpatch.org/src/frontend/templates:/app/src/frontend/templates:ro
