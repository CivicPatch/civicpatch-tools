services:
  pipelines-cicd:
    environment:
      - PIPELINE_RUN_COST_LIMIT

      - GOOGLE_GEMINI_TOKEN
      - TOGETHER_AI_TOKEN

      - SERVICE_API_KEY
      - CIVICPATCH_ORG_URL

      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    init: true # https://stackoverflow.com/questions/50634819/xvfb-run-hangs-in-container
    #image: ghcr.io/civicpatch/pipelines:latest
    build:
      context: ../..
      dockerfile: pipelines/Dockerfile.github-actions
    volumes:
      - ../data:/app/data
      - ../data_source:/app/data_source
