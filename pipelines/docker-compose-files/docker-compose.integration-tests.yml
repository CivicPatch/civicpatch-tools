services:
  pipelines-integration-tests:
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      APP_ROOT: /app
    init: true
    # Shares the dev stack's image instead of building a second 3.3GB copy.
    image: civicpatch-tools-pipelines:latest
    build:
      context: ../..
      dockerfile: pipelines/Dockerfile
      target: development
    volumes:
      - ..:/app
      - ../../shared/src/shared:/app/src/shared:ro
    working_dir: /app
    command: ["pytest", "tests/integration", "-m", "not live", "-v"]
