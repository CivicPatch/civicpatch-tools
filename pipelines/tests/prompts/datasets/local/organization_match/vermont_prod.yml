# A sample of the organization labels Vermont's prod pages listed people under, cut from each
# page's stored markdown on 2026-10-28: every distinct label naming a body, every judgment call (with
# its reason), every none that mentions a body word, and 30 plain-noise nones. Role labels are the
# forms' own, written once per organization set that places share. Read by tests/unit/evals/test_organization_match_vermont.py.
organization_sets:
  town:
  - name: Advisory Budget Committee
    role_labels:
    - Advisory Budget Committee Member
  - name: Board of Cemetery Commissioners
    role_labels:
    - Cemetery Commissioner
  - name: Board of Library Trustees
    role_labels:
    - Library Trustee
  - name: Board of Listers
    role_labels:
    - Lister
  - name: Selectboard
    role_labels:
    - Select Board Member
    - Chair
    - Vice Chair
  - name: Town Auditors
    role_labels:
    - Auditor
  - name: Town Meeting
    role_labels:
    - Moderator
  - meta_is_default: true
    name: Town Officers
    role_labels:
    - Town Clerk
    - Town Treasurer
    - First Constable
    - Second Constable
    - Collector of Delinquent Taxes
    - Trustee of Public Money
    - Road Commissioner
    - Patrol Officer
    - Town Manager
  - name: Trustees of Public Funds
    role_labels:
    - Trustee of Public Funds
  - name: Water Commissioners
    role_labels:
    - Water Commissioner
  village:
  - name: Board of Trustees
    role_labels:
    - Trustee
    - Village President
  - meta_is_default: true
    name: Village Officers
    role_labels:
    - Village Clerk
    - Village Treasurer
    - Collector of Taxes
  city:
  - meta_is_default: true
    name: City Officers
    role_labels: []
  - name: Council
    role_labels:
    - Council Member
  - name: Office of the Mayor
    role_labels:
    - Mayor
  city_3:
  - meta_is_default: true
    name: City Officers
    role_labels: []
  - name: Council
    role_labels:
    - Council Member
