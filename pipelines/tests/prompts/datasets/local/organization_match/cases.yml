# Chester: a library board written as the page does, and a staff office
- {place: chester, organization_label: "Whiting Library", expected: Board of Library Trustees}  # heading "Whiting Library", then "Trustees:"; elected by Chester voters
- {place: chester, organization_label: "Trustees of Public Funds", expected: Trustees of Public Funds}
