# organization label beside the person's own label, and the organization they belong in. Graded blind by two
# models, disagreements reviewed by hand. Kept: every case today's words place wrong or miss, every reviewed
# case, and a fixed sample of the rest. Page title and first heading as fetched 2026-11-18, where the site
# served them. Roles are Vermont's merged config, frozen so the yardstick holds still.
