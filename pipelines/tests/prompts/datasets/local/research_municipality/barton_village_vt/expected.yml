thoughts: >-
  Checked 2026-10-22 against the officers page (Lyon's term to March 2029, so updated after
  the March 2026 meeting) and the draft minutes of the 2026-03-10 annual meeting
  (https://bartonvt.com/wp-content/uploads/2026/03/Barton-Village-Annual-Minutes-03102026-DRAFT.pdf):
  three trustees on staggered three-year terms (2027, 2028, 2029), no President; Lyon chairs.
  The law post's five trustees is not borne out: no fourth or fifth trustee or vacancy in any
  source, so the law's number may be stale or misread. The meeting elected Jacqueline Laurion
  moderator; not listed here, as no meeting organization is given.
