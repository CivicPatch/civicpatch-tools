  thoughts: >-
    The Board of Selectmen roster: five members with titles, phones and terms. "Board of
    Selectmen" is the old name for the Select Board this form names, so the page is the
    governing body's own. The Town Manager and assistant listed above it are appointed
    staff and do not change the answer.

    The directory under "Contact Us" is where the run found each selectman's own page, so it
    must be followed; the Boards & Committees hub links onward to the other bodies.
