thoughts: >-
  A page can carry two organizations, and this is that case. Mayor Larry Agran appears with
  his photo as one of the listed members, above the councilmembers, so the page presents both
  the council's people and the mayor. Answering only "City Council" here would drop the mayor's
  extraction on the one page that has him.
