thoughts: >-
  A page headed "Staff Directory" that lists Scott Conger, Mayor, with his email and phone,
  above the Executive Assistant and the Chief of Staff. The heading describes who else is on
  it, not whether the officeholder is: this is the richest page on the site for the mayor and
  the one an extraction most wants to run on. The council is named only in the site menu.
