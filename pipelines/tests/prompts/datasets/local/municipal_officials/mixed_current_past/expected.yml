thought: The City Council section provides a clear table listing current officials,
  their positions, and deadlines to file for candidacy. These deadlines, combined
  with information about election cycles, allow for the estimation of term end dates.
  The labels are the position column verbatim. The prose note that council positions
  are 'At Large' is not part of any label, and at-large carries no value, so it names
  no division and no seat. General city contact information is used for phone and
  email as no individual contact details are provided. No start dates or images are
  available in the provided text.
