thought: 'Plan D4b (2026-10-28): Athens lists every board on one page as a bold label followed by
  names. The case the prod run (changeset 10151361) got wrong: "Campbell Fund Trustees: Carol
  Bingham, Morgan Wilbur, Krista Gay" is a fund''s own trustees, not one of Athens''s
  organizations, and Morgan Wilbur was placed in Trustees of Public Funds. Morgan Wilbur is
  not in this gold: no listed title, no listed organization. Carol Bingham and Krista Gay are
  in through their listed posts only. "Budget Committee" (appointed, four names, all already
  in) is Athens''s Advisory Budget Committee; no separate record arises because the gold holds
  one entry per person, as the pick schema returns one organization per person per page:
  David Bemis is also Moderator, Cemetery Commissioner and a Justice of the Peace, and keeps
  his Selectboard record. Out as unlisted: Justices of the Peace, Town Grand Juror, Housing
  Rehabilitation Grant Committee, Weather Emergency and Meetinghouse Committees, Planning
  Commission, Tree Warden, Fence Viewers, Health Officer; the Assistant Town Clerk is staff.
  The lists approximate the run''s (known_roles from the October posts); the page is the
  run''s own preprocessed.md from the debug bucket, 2026-10-28.'
