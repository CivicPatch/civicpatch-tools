thought: 'Seattle splits its elected officials across two bodies with separate pages:
  the Office of the Mayor at seattle.gov/mayor and the City Council at seattle.gov/council.
  This is the Council page, so only the nine Councilmembers are extracted. Joy Hollingsworth
  is Council President, which the member grid states beside her district; she also holds the
  District 3 Council Member seat, so her label carries both. Mayor Katie
  Wilson is named four times — once in the site navigation as a link to the Mayor''s
  Office, and three times in Council Connection news blurbs about Councilmembers
  responding to her — but she holds no Council seat and this page never presents her
  as one of its members. Note that STEP 1''s existing news-mention rule is already enough
  to exclude her, so this case guards that rule — it does not measure whether people are
  attributed to the right body. No Councilmember has an individual phone or
  email here, so all nine carry the Council''s own: the number in the footer contact
  block and the address the page offers for reaching every member. 206-684-2489, repeated
  around twenty times near the top, is the citywide Google Translate interpreter line,
  not an office contact.'
