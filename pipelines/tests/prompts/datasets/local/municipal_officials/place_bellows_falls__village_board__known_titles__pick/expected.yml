thought: 'Plan D4b (2026-10-28): the Town of Rockingham''s staff directory serves the town and
  both its villages, Bellows Falls and Saxtons River, and nearly every entry carries "Town of
  Rockingham/ Bellows Falls Village Corporation" whichever body it belongs to; only the section
  heading says. The prod run for Bellows Falls (changeset a9b41349) put four of Saxtons River''s
  trustees (Ellen Clark-Lawrence, Laura Wolfe, Kristen Swartwout, Andrew Dunbar, under "Saxtons
  River Village Trustees") on Bellows Falls'' Board of Trustees. The gold is the five under
  "Bellow Falls Village Trustees" (the site''s own spelling) and nobody else: Saxtons River''s
  trustees and officers and the Town of Rockingham Selectboard are other governments; the Town
  Clerk, Listers'' Office, Municipal Manager and departments are the town''s; committees and
  commissions are unlisted. The page is the run''s own preprocessed.md from the debug bucket;
  the lists approximate the run''s.'
