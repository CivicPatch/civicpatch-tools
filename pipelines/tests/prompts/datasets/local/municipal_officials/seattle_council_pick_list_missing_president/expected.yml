thought: 'The same Seattle City Council page and the same nine people as
  seattle_council_separate_mayor, but the pick list deliberately omits Council President. Joy
  Hollingsworth holds that post, so no entry on the list fits her, and the prompt must fall back
  to her title as written — "Council President District 3" — rather than forcing her into the
  nearest listed post, "Council Member District 3". A forced match reads as a confident, correct
  answer, which is why this case exists: it is the only one that can tell the escape hatch apart
  from a shove.'
