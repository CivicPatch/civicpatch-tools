thought: 'Merged by plan P5 from seattle_council_pick_list_missing_president, seattle_council_scoped_to_mayor.
  The same Seattle City Council page and the same nine people as seattle_council_separate_mayor,
  but the pick list deliberately omits Council President. Joy Hollingsworth holds
  the listed Council Member District 3 seat and the unlisted presiding title, so her
  label must carry both: the seat picked from the list, Council President written
  from the page. Dropping the title for the listed seat alone reads as a confident,
  correct answer, which is why this case exists: it is the only one that can tell
  the escape hatch apart from a shove.'
