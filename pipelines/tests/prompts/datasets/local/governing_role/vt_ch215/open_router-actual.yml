    maximum_memberships: 1
    quote: there shall be elected, by ballot if called for, for the ensuing year and
      until their successors are chosen, a Moderator, who shall preside at all meetings
      of said corporation, with powers of moderators at town meetings; a Clerk who
      shall keep a record of the proceedings of said meetings of said corporation,
      with power to certify to copies of the same, and who shall perform all the usual
      duties of a clerk; one trustee for a term of one year, one trustee for a term
      of two years, and one trustee for a term of three years, and thereafter at each
      annual meeting one trustee for a term of three years, who shall have the management
      of the affairs of said corporation with the necessary powers for that purpose,
      who may fill vacancies in the offices of said corporation, who may act by a
      majority, and of whom the oldest in office present at any meeting of said corporation
      shall preside when the Moderator is absent; a Treasurer and a Collector, who
      shall be sworn, and who shall discharge the usual duties of such officers
