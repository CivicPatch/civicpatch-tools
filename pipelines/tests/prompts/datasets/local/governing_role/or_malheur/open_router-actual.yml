    filled_by: elected_by_voters
    maximum_memberships: 2
    quote: 'The following county officers shall be elected at the primary election
      or general election, as provided in ORS 249.088: (a) A sheriff. (b) A county
      clerk. (c) A county assessor. (d) A county treasurer. (e) A county commissioner
      to succeed any commissioner whose term of office expires the following January.
      (f) In any county where there is a vacancy from any cause in the office of county
      commissioner, an additional commissioner to fill the vacancy.'
