    filled_by: elected_by_voters
    maximum_memberships: 3
    quote: The elective officers of the Village shall be a President, a Clerk, a Treasurer,
      a Collector of Taxes, three auditors, three trustees, and a Chief Engineer of
      the Fire Department, together with such other officers as the public interest
      may require and the laws of this State may permit. All the officers shall be
      elected at the annual meeting for a term of one year, except that in the case
      of the trustees, the term of office shall be three years, one trustee to be
      elected at each annual meeting.
