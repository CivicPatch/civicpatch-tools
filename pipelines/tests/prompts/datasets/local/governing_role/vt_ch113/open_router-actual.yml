- role_id: moderator
  expected: elected_by_voters
  right: true
  each_right:
  - true
  - true
  agreed: true
  answers:
  - established: true
    label: Moderator
    filled_by: elected_by_voters
    maximum_memberships: 1
    quote: 'At the annual meeting, the Town shall elect by Australian ballot from
      among the legally qualified voters thereof the following Town officers, who
      shall serve until the next annual meeting or until others are chosen. (1) Selectboard,
      number, terms of office, election: (A) There shall be a Selectboard consisting
      of five members, and all Selectboard members shall be elected at large. (B)
      Three members of the Selectboard shall have terms of office of three years;
      two members shall have terms of office of two years. At each election, one Selectboard
      member shall be elected for a three-year term and one for a two-year term. (2)
      A Moderator.'
