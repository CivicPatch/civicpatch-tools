  - established: true
    label: trustees
    filled_by: elected_by_voters
    maximum_memberships: 3
    quote: The officers of said corporation shall consist of a Moderator, Clerk, three
      trustees, Treasurer, Collector of Taxes, a Chief Engineer, and two assistant
      engineers, all of whom, with the exception of the trustees, shall be elected
      annually and shall hold their respective offices for the term of one year and
      until others are chosen in their places; said trustees shall be elected by ballot,
      and, except the first two elected, shall hold office for the term of three years,
      but the term of office for the first two chosen shall be one year for the first
      and two years for the second. Thereafter one trustee shall be elected annually
      for the term of three years.
