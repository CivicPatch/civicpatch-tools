[project]
name = "worker"
version = "0.1.0"
description = "Temporal worker sidecar for civicpatch pipeline orchestration"
requires-python = ">=3.12,<3.14"
dependencies = [
    "temporalio>=1.10.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.10.0",
    "pydantic>=2.12.0",
    "shared",
]

[project.optional-dependencies]
dev = ["watchfiles>=1.0.0"]

[tool.uv]
package = true

[tool.uv.sources]
shared = { workspace = true }
