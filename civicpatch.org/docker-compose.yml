services:
  civicpatch-org:
    container_name: civicpatch-org
    environment:
      # Required
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}

      # Defaults OK
      CIVICPATCH_API_DB_PASSWORD: ${CIVICPATCH_API_DB_PASSWORD:-development_password}
      CIVICPATCH_API_DB_URL: ${CIVICPATCH_API_DB_URL:-postgres://civicpatch:development_password@civicpatch-org-db:5432/development_db}

      COOKIE_INSTANCE_URL: ".civicpatch.org"
      INSTANCE_URL: "http://localhost:8000"
      OPEN_DATA_REPO_URL: "https://api.github.com/repos/CivicPatch/open-data" # Todo: use test data & server
      JURISDICTIONS_REPO_URL: "https://api.github.com/repos/openstates/jurisdictions"
      JURISDICTIONS_FORK_REPO_URL: "https://api.github.com/repos/CivicPatch/jurisdictions"
      JURISDICTIONS_SYNC_APP_ID: ${JURISDICTIONS_SYNC_APP_ID}
      JURISDICTIONS_SYNC_APP_PRIVATE_KEY_BASE64: ${JURISDICTIONS_SYNC_APP_PRIVATE_KEY_BASE64}
      JURISDICTIONS_SYNC_APP_INSTALLATION_ID: ${JURISDICTIONS_SYNC_APP_INSTALLATION_ID}
      MAINTAINER_EMAIL: "michelle@civicpatch.org"

      REDIS_HOST: civicpatch-org-redis
      JWT_SECRET_KEY: jwt-secret-key-here
      DATABASE_HASH_KEY: database-hash-key
      SERVICE_API_KEY: "service-api-key"
      BLOG_SYNC_WEBHOOK_SECRET: "blog-sync-webhook-secret"

      # Optional; only needed for syncing github webhooks
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}

      # Optional; only for scraping
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID}
      GOOGLE_SHEETS_PRIVATE_KEY_BASE64: ${GOOGLE_SHEETS_PRIVATE_KEY_BASE64}
      GOOGLE_SHEETS_CLIENT_EMAIL: ${GOOGLE_SHEETS_CLIENT_EMAIL}
      GOOGLE_SHEETS_TOKEN_URI: ${GOOGLE_SHEETS_TOKEN_URI}

      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}

      # Local Supabase stack is managed by the Supabase CLI (`supabase start`,
      # invoked by `mise run dev`). The backend reaches it via the host gateway;
      # the FE never talks to Supabase directly (auth proxies through this backend).
      SUPABASE_URL: "http://host.docker.internal:54321"
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-local-dev-secret-key}
    build:
      context: ..
      dockerfile: civicpatch.org/Dockerfile
      target: development
    # restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ../shared/src/shared:/app/src/shared:ro
    networks:
      - civicpatch_net
    depends_on:
      civicpatch-org-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway" # for supabase calls
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost', 8000), timeout=2); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  civicpatch-org-db:
    image: postgis/postgis:17-3.5
    # restart: always
    environment:
      POSTGRES_USER: civicpatch
      POSTGRES_PASSWORD: development_password
      POSTGRES_DB: development_db
    volumes:
      - api_civicpatch_org_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:8003:5432"
    networks:
      - civicpatch_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpatch -d development_db"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  civicpatch-org-redis:
    image: redis:alpine
    #expose:
    #  - "6379"
    ports:
      - "6379:6379"
    networks:
      - civicpatch_net

  civicpatch-org-worker:
    container_name: civicpatch-org-worker
    build:
      context: ..
      dockerfile: civicpatch.org/Dockerfile
      target: development
    entrypoint: ["python", "src/worker.py"]
    depends_on:
      civicpatch-org:
        condition: service_healthy
    environment:
      # Required by environment.get_env_vars() even though the worker
      # doesn't call Supabase. Values mirror the civicpatch-org service.
      SUPABASE_URL: "http://host.docker.internal:54321"
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-local-dev-secret-key}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}
      CIVICPATCH_API_DB_URL: ${CIVICPATCH_API_DB_URL:-postgres://civicpatch:development_password@civicpatch-org-db:5432/development_db}
      CIVICPATCH_API_DB_PASSWORD: ${CIVICPATCH_API_DB_PASSWORD:-development_password}
      REDIS_HOST: civicpatch-org-redis
      OPEN_DATA_REPO_URL: "https://api.github.com/repos/CivicPatch/open-data"
      JURISDICTIONS_REPO_URL: "https://api.github.com/repos/openstates/jurisdictions"
      JURISDICTIONS_FORK_REPO_URL: "https://api.github.com/repos/CivicPatch/jurisdictions"
      JURISDICTIONS_SYNC_APP_ID: ${JURISDICTIONS_SYNC_APP_ID}
      JURISDICTIONS_SYNC_APP_PRIVATE_KEY_BASE64: ${JURISDICTIONS_SYNC_APP_PRIVATE_KEY_BASE64}
      JURISDICTIONS_SYNC_APP_INSTALLATION_ID: ${JURISDICTIONS_SYNC_APP_INSTALLATION_ID}
      INSTANCE_URL: "http://localhost:8000"
      COOKIE_INSTANCE_URL: ".civicpatch.org"
      MAINTAINER_EMAIL: ${MAINTAINER_EMAIL:-admin@civicpatch.org}
      DATABASE_HASH_KEY: ${DATABASE_HASH_KEY:-development_hash_key}
      SERVICE_API_KEY: "service-api-key"
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      FRIENDLY_STORAGE_HOST: ${FRIENDLY_STORAGE_HOST:-https://cdn.civicpatch.org}
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      DB_POOL_MIN_SIZE: 1
      DB_POOL_MAX_SIZE: 2
    volumes:
      - ./:/app
      - ../shared/src/shared:/app/src/shared:ro
    networks:
      - civicpatch_net
    develop:
      watch:
        - path: ./src
          action: restart
        - path: ../shared/src/shared
          action: restart

volumes:
  api_civicpatch_org_db_data:
  #test_pgdata:

networks:
  civicpatch_net:
    driver: bridge
  civicpatch_test_net:
    driver: bridge
