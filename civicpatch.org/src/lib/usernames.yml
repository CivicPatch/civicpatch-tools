# Wordlists for suggested display_name autofill on the settings page.
# Sourced from:
#   - haikunator (MIT, https://github.com/Atrox/haikunatorpy) — nature/color/poetic
#   - moby/moby names-generator (Apache-2, https://github.com/moby/moby) — personality
#   - unique-names-generator (MIT, https://github.com/andreasonny83/unique-names-generator) — animals
#   - places: curated in-repo (landscape/location words, kept disjoint from nouns)
# Vendored as-is (deduped, sorted); the output is a suggestion the user can
# accept or replace, so no curation pass. If a specific word surfaces as
# problematic, drop it from the relevant list below.
#
# generate_display_name() picks adjective + noun by default; if that combo is
# already in use by another user's display_name, a place is appended as a
# third token (e.g. "wandering-bear-grove").

