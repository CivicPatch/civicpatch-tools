<!doctype html>

<html>
    <head>
        <script>
            // Theme before first paint. Must mirror useLocalStorage's read: it
            // stores {__value, __expiresAt}, so taking the raw string here puts
            // JSON into data-theme, matches no selector, and paints the default
            // theme until the navbar hydrates — a flash of the wrong theme,
            // which is the one thing this script exists to prevent. On pages
            // where the navbar never upgrades (unauthorized), it never corrects.
            (function () {
                var stored = localStorage.getItem("app:theme");
                var theme = "";
                if (stored) {
                    try {
                        var parsed = JSON.parse(stored);
                        theme =
                            parsed && typeof parsed === "object"
                                ? parsed.__value
                                : parsed;
                    } catch (e) {
                        theme = stored; // written before the envelope existed
                    }
                }
                if (theme !== "dark" && theme !== "light") {
                    theme = window.matchMedia("(prefers-color-scheme: dark)")
                        .matches
                        ? "dark"
                        : "light";
                }
                document.documentElement.dataset.theme = theme;
            })();
        </script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}civicpatch tool{% endblock %}</title>

        <!-- tokens.css declares the layer order: base, layout, components, utilities. -->
        <link rel="preload" as="font" type="font/woff2" crossorigin
            href="{{ url_for('frontend', path='/fonts/public-sans-variable.woff2') }}" />
        <link rel="preload" as="font" type="font/woff2" crossorigin
            href="{{ url_for('frontend', path='/fonts/ibm-plex-mono-400.woff2') }}" />
        <link
            href="{{ url_for('frontend', path='/css/fonts.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('frontend', path='/css/tokens.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('frontend', path='/css/elements.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('frontend', path='/css/typography.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('frontend', path='/css/controls.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('frontend', path='/css/layout.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('frontend', path='/css/styles.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('frontend', path='/css/utilities.css') }}"
            rel="stylesheet"
        />


        {% block styles %}{% endblock %}
        {% block head %}{% endblock %}



    </head>
    <body>
        <main class="container-fluid {% block main_class %}{% endblock %}">
            {% block content %}{% endblock %}
        </main>

        {% block footer %}{% endblock %}

        <script src="{{ url_for('frontend', path='/assets/env.js') }}"></script>

        {% if not is_production %}
        <script type="module" src="{{ vite_asset('@vite/client') }}"></script>
        {% endif %}

        {% block scripts %}{% endblock %}
    </body>
</html>
