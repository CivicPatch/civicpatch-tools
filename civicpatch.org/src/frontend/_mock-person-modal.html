<!doctype html>
<html>
  <head>
    <!-- THROWAWAY MOCKUP for iterating on the person-edit modal + link section. Delete when done. -->
    <script>
      (function () {
        var t = localStorage.getItem("app:theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>person edit modal — with link section</title>
    <link href="css/pico.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <!-- the REAL component CSS, so field layout / dense styles / sticky footer match exactly -->
    <link href="components/edit-people/person-edit-modal.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
      body { padding: 1.5rem; }

      /* read-only profile photo at the top of the modal (image isn't editable here) */
      .person-edit__identity {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 0.6rem;
      }
      .person-edit__photo-img {
        width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
        background: rgb(var(--tone-line-mid));
        background-size: cover; background-position: center;
      }
      .person-edit__identity-grid {
        flex: 1; min-width: 0;
        display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 0.85rem;
      }

      /* ── proposed: "Link to existing person" section (new design) ── */
      .person-edit__link {
        border: 1px solid var(--pico-muted-border-color);
        border-radius: var(--pico-border-radius);
        background: rgb(var(--tone-bg-deep));
        padding: 0.85rem 0.9rem;
        margin-bottom: 0.6rem;
      }
      .person-edit__link-status {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0 0 0.6rem;
        font-size: var(--text-sm);
        color: var(--pico-muted-color);
      }
      .person-edit__link-label {
        font-size: var(--text-xs);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--pico-muted-color);
        margin: 0.6rem 0 0.3rem;
      }
      .person-edit__link-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
      .person-edit__link-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.45rem 0.6rem;
        border-radius: var(--pico-border-radius);
        background: rgb(var(--tone-bg));
      }
      .person-edit__link-avatar {
        width: 1.7rem; height: 1.7rem; border-radius: 50%; flex-shrink: 0;
        background: rgb(var(--tone-line-mid));
      }
      .person-edit__link-name { font-weight: 600; font-size: var(--text-sm); }
      .person-edit__link-office { color: var(--pico-muted-color); font-size: var(--text-xs); flex: 1; min-width: 0; }
      .person-edit__link-item button { margin: 0; padding: 0.2rem 0.7rem; flex-shrink: 0; }
      .person-edit__link-search { margin-top: 0.45rem; }
      .person-edit__link-search input { margin: 0; }

      /* linked state */
      .person-edit__link--linked { display: flex; align-items: center; gap: 0.5rem; }
      .person-edit__link--linked .person-edit__link-name { flex: 0 0 auto; }
      .person-edit__link-unlink {
        margin: 0 0 0 auto; padding: 0.2rem 0.6rem;
        background: transparent; border: 1px solid var(--pico-muted-border-color); color: var(--pico-muted-color);
        font-size: var(--text-xs);
      }
    </style>
  </head>
  <body>
    <dialog open>
      <article>
        <header><h2>Edit person</h2></header>
        <section>
          <div class="person-edit__form">

            <!-- ════ NEW: link section — at the top: resolve "is this an existing person?" first ════ -->
            <div class="person-edit__link">
              <p class="person-edit__link-status">
                <i class="fa-solid fa-link" style="color:var(--pico-primary)"></i>
                This might already exist — link to an existing record?
              </p>
              <ul class="person-edit__link-list">
                <li class="person-edit__link-item">
                  <span class="person-edit__link-avatar"></span>
                  <span class="person-edit__link-name">Sofia A. Ramirez</span>
                  <span class="person-edit__link-office">City Council — District 1</span>
                  <button class="btn btn-sm">Link</button>
                </li>
                <li class="person-edit__link-item">
                  <span class="person-edit__link-avatar"></span>
                  <span class="person-edit__link-name">S. Ramirez</span>
                  <span class="person-edit__link-office">Mayor</span>
                  <button class="btn btn-sm">Link</button>
                </li>
              </ul>
            </div>

            <!-- ════ identity: read-only photo paired with name + office ════ -->
            <div class="person-edit__identity">
              <span class="person-edit__photo-img" style="background-image:url('https://i.pravatar.cc/112?img=47')" role="img" aria-label="Photo of Sofia Ramirez"></span>
              <div class="person-edit__identity-grid">
                <label class="person-edit__field">Name<input type="text" value="Sofia Ramirez" /></label>
                <label class="person-edit__field">Office name<input type="text" value="City Council" /></label>
              </div>
            </div>

            <!-- ════ existing fields (unchanged) ════ -->
            <div class="person-edit__grid">
              <div class="person-edit__field">Start date
                <div class="person-edit__date">
                  <input class="year" type="number" value="2023" placeholder="Year" />
                  <select class="month"><option selected>—</option><option>Jan</option></select>
                  <select class="day" disabled><option selected>—</option></select>
                </div>
              </div>
              <div class="person-edit__field">End date
                <div class="person-edit__date">
                  <input class="year" type="number" value="2027" placeholder="Year" />
                  <select class="month"><option>—</option><option selected>Jan</option></select>
                  <select class="day"><option>—</option><option selected>1</option></select>
                </div>
              </div>
              <div class="person-edit__field person-edit__field--full">Division
                <div class="person-edit__division">
                  <select><option>At-large (no district)</option><option selected>Council District</option><option>Ward</option></select>
                  <input type="text" value="1" placeholder="required" />
                </div>
                <small class="person-edit__hint">ocd-division/country:us/state:ca/place:san_buenaventura/council_district:1</small>
              </div>
            </div>

            <p class="person-edit__section-title">Phones</p>
            <div class="person-edit__rows">
              <div class="person-edit__row">
                <input type="text" value="(805) 555-0100" />
                <button class="btn btn-sm person-edit__icon-btn"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
            <button class="btn btn-sm person-edit__add"><i class="fa-solid fa-plus"></i> Add phone</button>

            <p class="person-edit__section-title">Sources <small style="font-weight:400;text-transform:none;letter-spacing:0;">— open to verify against</small></p>
            <div class="person-edit__rows">
              <div class="person-edit__row">
                <button class="btn btn-sm person-edit__source-open"><i class="fa-solid fa-up-right-from-square"></i></button>
                <input type="text" value="https://cityofventura.gov/agendas/2023-01.pdf" />
                <button class="btn btn-sm person-edit__icon-btn"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
            <button class="btn btn-sm person-edit__add"><i class="fa-solid fa-plus"></i> Add source</button>
          </div>
        </section>
        <footer>
          <div style="display:flex;justify-content:flex-end;gap:0.5rem;margin:0;">
            <button class="secondary outline">Cancel</button>
            <button class="btn-gradient">Save</button>
          </div>
        </footer>
      </article>
    </dialog>
  </body>
</html>
