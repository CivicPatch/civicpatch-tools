services:
  civicpatch-org-test-db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: civicpatch
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "127.0.0.1:6001:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpatch -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
