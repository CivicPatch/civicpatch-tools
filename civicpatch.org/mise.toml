[env]
# _.file = ".deployment.env"
_.file = "../../civicpatch.org.env"
PYTHONPATH = "./src"

[tasks.typecheck]
run = "cd src/frontend && npm run typecheck"

[tasks.unit]
run = """
docker compose -f docker-compose.yml run --rm civicpatch-org-test pytest -vvm unit tests/unit
"""

[tasks.dev]
run = """
docker compose run --rm civicpatch-org
"""

[tasks.seed-dev-prs]
description = "Seed dev database with open PRs from GitHub"
usage = 'flag "--limit <limit>" help="Maximum number of PRs to seed" default="10"'
run = "docker exec -w /app civicpatch-org python src/scripts/seed_dev_prs.py --limit ${usage_limit}"

[tasks.containsh]
run = "docker compose exec civicpatch-org bash"

[tasks.deploy_civicpatch_org]
run = "python scripts/deploy.py"

[tasks.generate-url]
run = "docker compose run --rm civicpatch-org uv run python src/scripts/one-off-generate-file-url.py request_fa6157f0-c3bf-4432-b3b3-f7c8c8b2905e_wa_5336045.zip"

[tasks.trigger-github]
run = "docker compose run --rm api.civiccpatch.org uv run pytest -vv -s tests/test_github_service.py"

[tasks.process-zip]
run = "docker compose run --rm civicpatch-org uv run pytest -vv -s tests/test_cloudflare.py"

# New task to test R2 credentials
[tasks.test-r2]
description = "Test Cloudflare R2 credentials by uploading a small test file"
run = """
docker compose run --rm civicpatch-org uv run python -c '
import boto3, os
from botocore.client import Config
from io import BytesIO

client = boto3.client("s3",
    endpoint_url=os.environ["STORAGE_ENDPOINT"],
    aws_access_key_id=os.environ["STORAGE_ACCESS_KEY_ID"],
    aws_secret_access_key=os.environ["STORAGE_SECRET_ACCESS_KEY"],
    region_name="auto",
    config=Config(signature_version="s3v4", s3={"addressing_style": "virtual"})
)

# Create file-like object
test_data = BytesIO(b"test content")

try:
    client.upload_fileobj(
        test_data,
        "crudder",
        "test.txt"
    )
    print("✓ Successfully uploaded test file")
    # client.delete_object(Bucket="civicpatch", Key="test.txt")
    print("✓ Successfully cleaned up test file")
except Exception as e:
    print(f"✗ Error: {str(e)}")
finally:
    test_data.close()
'
"""

