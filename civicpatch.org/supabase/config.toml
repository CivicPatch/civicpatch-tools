# Supabase project configuration for civicpatch.org.
#
# Local stack (`supabase start`):
#   - Base config below applies. Auth emails default to the bundled Inbucket
#     SMTP capture (web UI at http://localhost:54324).
#   - Services we don't need are explicitly disabled to keep memory usage down.
#
# Cloud push (`supabase config push --project-ref ...`):
#   - The [remotes.<env>] block whose project_id matches the ref is layered
#     on top of the base config. Resend SMTP credentials live there.

project_id = "civicpatch-org"

# ── Disable services we don't use (local stack only; ignored on cloud push) ──
[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[studio]
enabled = false

[analytics]
enabled = false

# ── Auth settings (CORS origins for OTP and auth API calls) ──────────────────
# `site_url` and `additional_redirect_urls` tell Supabase Auth which origins
# are allowed to call the auth API (signInWithOtp, verifyOtp, etc.).
# Without these, the local GoTrue service rejects cross-origin requests.
[auth]
site_url = "http://localhost:8000"
additional_redirect_urls = ["http://localhost:5173"]

# ── Email templates (apply to both local and cloud) ──────────────────────────
# Magic Link template — fires for existing users on signInWithOtp.
[auth.email.template.magic_link]
subject = "Your civicpatch sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Confirmation template — fires for brand-new emails on signInWithOtp
# when shouldCreateUser is true.
[auth.email.template.confirmation]
subject = "Your civicpatch sign-in code"
content_path = "./supabase/templates/confirmation.html"

# ── Cloud-only SMTP overrides ────────────────────────────────────────────────
# Resend SMTP is pushed to cloud projects on `supabase config push`. RESEND_API_KEY
# and EMAIL_SENDER_NAME are injected by `infisical run` (see
# .github/workflows/deploy_supabase.yml).

[remotes.test]
project_id = "fcrzkckicxxmicrcbxed"

[remotes.test.auth]
site_url = "https://test.civicpatch.org"
additional_redirect_urls = ["https://app.civicpatch.org", "https://components.civicpatch.org"]

[remotes.test.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@mail.civicpatch.org"
sender_name = "env(EMAIL_SENDER_NAME)"

[remotes.prod]
project_id = "vclvvgolzzebiojevjsx"

[remotes.prod.auth]
site_url = "https://civicpatch.org"
additional_redirect_urls = ["https://app.civicpatch.org", "https://components.civicpatch.org"]

[remotes.prod.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@mail.civicpatch.org"
sender_name = "env(EMAIL_SENDER_NAME)"
