[project]
name = "civicpatch.org"
version = "0.1.0"
description = ""
authors = [
    {name = "michelle@shelltr.me",email = "michelle@shelltr.me"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.116.1,<0.117.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "requests (>=2.32.5,<3.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "boto3 (>=1.40.35,<2.0.0)",
    "python-lsp-server[all] (>=1.13.1,<2.0.0)",
    "psycopg[binary,pool] (>=3.2.12,<4.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "google-api-python-client (>=2.189.0,<3.0.0)",
    "nameparser (>=1.1.3,<2.0.0)",
    "rapidfuzz (>=3.14.0,<4.0.0)",
    "redis (>=7.2.1,<8.0.0)",
    "fastapi-profiler (>=1.4.1,<2.0.0)",
    "pyjwt>=2.11.0",
    "shared",
    "githubkit>=0.15.1",
    "temporalio>=1.10.0",
    "pyarrow>=18.0.0",
    "tippecanoe>=2.72.0",
    "httpx>=0.28.0",
    "ruamel-yaml>=0.19.1,<0.20.0",
    "python-frontmatter>=1.1.0,<2.0.0",
    "markdown>=3.7,<4.0",
    "bleach>=6.3.0",
    "pymdown-extensions>=10.21.3",
    "supabase (>=2.30.0,<3.0.0)",
]

[dependency-groups]
dev = [
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pyright (>=1.1.0)",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
markers = [
    "unit: fast, no external dependencies",
    "integration: mark a test as an integration test",
]

[tool.uv]
package = true

[tool.uv.sources]
shared = { workspace = true }
