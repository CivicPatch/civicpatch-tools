[tools]
pre-commit = "latest"
python = "3.12"
uv = "latest"
node = "25.8"
gh = "latest"
gcloud = "latest"
jq = "latest"
supabase = "2.98.0"

[env]
_.file = ["../pipelines.env", "../civicpatch.org.env"]
# Local-dev value. Matches what the FastAPI app expects when not overridden
# by docker-compose / .env. Production uses $PROD_SERVICE_API_KEY (from secrets).
SERVICE_API_KEY = "service-api-key"


[tasks.setup]
run = "mise install && pre-commit install && pre-commit install --hook-type pre-push && uv sync --all-packages"
description = "Install all workspace dependencies"

###################################################
## 🚀✨ Syncs                                ✨🚀 ##
###################################################

[tasks.pr_sync]
run = """
    curl -X POST "http://localhost:8000/api/admin/pr_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: $SERVICE_API_KEY"
"""

[tasks.pr_sync_prod]
run = """
    curl -X POST "https://civicpatch.org/api/admin/pr_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: $PROD_SERVICE_API_KEY"
"""

[tasks.od_sync]
run = """
    curl -X POST "http://localhost:8000/api/admin/od_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: service-api-key" \
      -d '{}'
"""
#\
# -d '{"jurisdiction_ocdids": ["ocd-jurisdiction/country:us/state:tx/place:combes/government"]}'

[tasks.od_sync_prod]
run = """
    curl -X POST "https://civicpatch.org/api/admin/od_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: $PROD_SERVICE_API_KEY" \
      -d '{}'
"""

[tasks.refresh_test_open_data]
description = "Reset CivicPatch/test-open-data to match CivicPatch/open-data main: fetches from open-data, updates the local ./test-open-data clone, and force-pushes to test-open-data on GitHub. Destructive: any uncommitted changes in the local clone are discarded; open dev PR feature branches on test-open-data are preserved."
run = """
set -eu
TEST_DIR="${TEST_OPEN_DATA_DIR:-./test-open-data}"
SOURCE_URL="${OPEN_DATA_SOURCE_URL:-https://github.com/CivicPatch/open-data.git}"
TARGET_URL="${OPEN_DATA_TARGET_URL:-https://github.com/CivicPatch/test-open-data.git}"

if [ ! -d "$TEST_DIR/.git" ]; then
  echo "→ First-time clone of $SOURCE_URL into $TEST_DIR"
  git clone "$SOURCE_URL" "$TEST_DIR"
else
  echo "→ Fetching main from $SOURCE_URL"
  git -C "$TEST_DIR" fetch "$SOURCE_URL" main
  git -C "$TEST_DIR" checkout -f -B main FETCH_HEAD
fi

if ! git -C "$TEST_DIR" remote get-url test-open-data >/dev/null 2>&1; then
  echo "→ Adding 'test-open-data' remote pointing at $TARGET_URL"
  git -C "$TEST_DIR" remote add test-open-data "$TARGET_URL"
fi

echo "→ Force-pushing main to $TARGET_URL"
git -C "$TEST_DIR" push --force test-open-data main
echo "✓ test-open-data updated locally at $TEST_DIR and on GitHub ($(git -C "$TEST_DIR" rev-parse --short HEAD))"
"""


[tasks.clear_dashboard_cache]
run = """
    curl -X POST "http://localhost:8000/api/admin/clear_dashboard_cache" \
      -H "Content-Type: application/json" \
      -H "Authorization: $SERVICE_API_KEY"
"""

[tasks.clear_dashboard_cache_prod]
run = """
    curl -X POST "https://civicpatch.org/api/admin/clear_dashboard_cache" \
      -H "Content-Type: application/json" \
      -H "Authorization: $PROD_SERVICE_API_KEY"
"""

[tasks.grant_role]
description = "Set a user's trust level by email (local). Usage: mise run grant_role <email> <role>"
usage = '''
arg "<email>"
arg "<role>"
'''
run = """
    set -eu
    AUTH="$SERVICE_API_KEY"
    EMAIL="$usage_email"
    ROLE=$(echo "$usage_role" | tr '[:upper:]' '[:lower:]')

    USERS=$(curl -fsS "http://localhost:8000/api/admin/users" -H "Authorization: $AUTH")
    MATCHES=$(echo "$USERS" | jq -c --arg email "$EMAIL" '[.data[] | select(.email == $email)]')
    COUNT=$(echo "$MATCHES" | jq 'length')
    if [ "$COUNT" = "0" ]; then
      echo "User not found: $EMAIL" >&2
      exit 1
    fi
    if [ "$COUNT" != "1" ]; then
      echo "Note: $EMAIL has $COUNT rows; setting role on all." >&2
    fi

    BODY=$(jq -nc --arg role "$ROLE" '{role: $role}')
    echo "$MATCHES" | jq -r '.[].id' | while read -r USER_ID; do
      curl --fail-with-body -sS -X PUT "http://localhost:8000/api/admin/users/$USER_ID/role" \
        -H "Content-Type: application/json" \
        -H "Authorization: $AUTH" \
        -d "$BODY" || { echo "Failed: user_id=$USER_ID" >&2; exit 1; }
      echo
      echo "Set $EMAIL to role '$ROLE' (user_id=$USER_ID)"
    done
"""

[tasks.grant_role_prod]
description = "Set a user's trust level by email (prod). Usage: mise run grant_role_prod <email> <role>"
usage = '''
arg "<email>"
arg "<role>"
'''
run = """
    set -eu
    AUTH="$PROD_SERVICE_API_KEY"
    EMAIL="$usage_email"
    ROLE=$(echo "$usage_role" | tr '[:upper:]' '[:lower:]')

    USERS=$(curl -fsS "https://civicpatch.org/api/admin/users" -H "Authorization: $AUTH")
    MATCHES=$(echo "$USERS" | jq -c --arg email "$EMAIL" '[.data[] | select(.email == $email)]')
    COUNT=$(echo "$MATCHES" | jq 'length')
    if [ "$COUNT" = "0" ]; then
      echo "User not found: $EMAIL" >&2
      exit 1
    fi
    if [ "$COUNT" != "1" ]; then
      echo "Note: $EMAIL has $COUNT rows; setting role on all." >&2
    fi

    BODY=$(jq -nc --arg role "$ROLE" '{role: $role}')
    echo "$MATCHES" | jq -r '.[].id' | while read -r USER_ID; do
      curl --fail-with-body -sS -X PUT "https://civicpatch.org/api/admin/users/$USER_ID/role" \
        -H "Content-Type: application/json" \
        -H "Authorization: $AUTH" \
        -d "$BODY" || { echo "Failed: user_id=$USER_ID" >&2; exit 1; }
      echo
      echo "Set $EMAIL to role '$ROLE' (user_id=$USER_ID)"
    done
"""


###################################################
## 🚀✨ Tests                                ✨🚀 ##
###################################################

[tasks.pytest-shared]
run = "uv run pytest"
dir = "shared"

[tasks.tpipes]
run = "uv run pytest tests/unit"
dir = "pipelines"

[tasks.tlive]
description = "Run live scrape tests locally (hits real external URLs, never run in CI — runs headless=False so the browser is visible)"
run = "uv run pytest tests/integration -m live -s -v"
dir = "pipelines"

[tasks.tcpi]
description = "Run pipelines integration tests inside Docker (requires spaCy, Playwright)"
run = "docker compose -f pipelines/docker-compose-files/docker-compose.integration-tests.yml run --rm pipelines-integration-tests"

[tasks.evalsm]
run = "uv run pytest tests/prompts/tests/evals/test_local_municipal_officials_eval.py"
dir = "pipelines"

[tasks.evalsr]
run = "uv run pytest tests/prompts/tests/evals/test_local_relevant_page_eval.py"
dir = "pipelines"

[tasks.evals]
run = "uv run pytest -m evals tests/prompts"
dir = "pipelines"

[tasks.evalsd]
run = "uv run pytest tests/prompts/tests/evals/test_find_jurisdiction_url_eval.py"
dir = "pipelines"

[tasks.evals_roles]
description = "Run the role-normalization eval (offline, no LLM)"
run = "uv run pytest tests/prompts/tests/evals/role_normalization/"
dir = "pipelines"

[tasks.e2e-install]
description = "Install e2e dependencies and Playwright browsers (run once)"
run = "npm install && npx playwright install chromium"
dir = "e2e"

[tasks.e2e]
description = "Build frontend, start e2e stack, open Playwright UI — tears down on exit"
run = """
set -e
npm install
npx playwright install chromium
cd ../civicpatch.org/src/frontend && npm install && npm run build
cd - > /dev/null
docker compose -f ../docker-compose.e2e.yml -f ../docker-compose.e2e.local.yml up db-e2e redis-e2e civicpatch-org-e2e -d --wait
npx playwright test --ui --ui-host=0.0.0.0 --ui-port=8123 || true
docker compose -f ../docker-compose.e2e.yml -f ../docker-compose.e2e.local.yml down -v --remove-orphans
"""
dir = "e2e"
env = { BASE_URL = "http://localhost:8100", E2E_DB_URL = "postgres://e2e:e2e_password@localhost:8101/e2e_db", E2E_REDIS_HOST = "localhost", E2E_REDIS_PORT = "8102" }

[tasks.e2e-ci]
description = "Run Playwright e2e tests headless in a fully isolated Docker stack (for CI)"
run = """
docker compose -f docker-compose.e2e.yml down -v --remove-orphans || true
docker compose -f docker-compose.e2e.yml build civicpatch-org-e2e
docker compose -f docker-compose.e2e.yml up --exit-code-from playwright --abort-on-container-exit 2>&1 | grep -E "^(playwright-1|ERROR|civicpatch-e2e)"
"""


[tasks.tcp]
run = "uv run pytest -m unit"
dir = "civicpatch.org"

[tasks.tcp-db-up]
description = "Start the integration test database and wait until healthy"
run = "docker compose -f civicpatch.org/docker-compose.integration.yml up -d --wait"

[tasks.tcp-db-down]
description = "Stop and remove the integration test database"
run = "docker compose -f civicpatch.org/docker-compose.integration.yml down -v"

[tasks.tcp-db-migrate]
description = "Apply all migrations to the integration test database"
run = """
env \
  CIVICPATCH_API_DB_URL=postgres://civicpatch:test_password@127.0.0.1:6001/test_db \
  CIVICPATCH_API_DB_PASSWORD=test_password \
  GITHUB_APP_ID=x GITHUB_APP_PRIVATE_KEY_BASE64=x GITHUB_APP_INSTALLATION_ID=x \
  SUPABASE_URL=x SUPABASE_SECRET_KEY=x \
  INSTANCE_URL=x OPEN_DATA_REPO_URL=x MAINTAINER_EMAIL=x \
  REDIS_HOST=x DATABASE_HASH_KEY=x SERVICE_API_KEY=x COOKIE_INSTANCE_URL=x \
  uv run python database_operations/migrate.py up
"""
dir = "civicpatch.org"

[tasks.tcp-integration]
description = "Start test DB, migrate, run integration tests, tear down"
run = """
set -e
mise run tcp-db-up
mise run tcp-db-migrate
mise run tcp -- -m integration
"""

[tasks.typecheck-fe]
run = "npm run typecheck"
dir = "civicpatch.org/src/frontend"
description = "Run TypeScript typecheck on civicpatch.org frontend"

[tasks.typecheck-cp]
run = "uv run pyright"
dir = "civicpatch.org"
description = "Run pyright type checker on civicpatch.org"

[tasks.typecheck-worker]
run = "uv run pyright"
dir = "worker"
description = "Run pyright type checker on worker"

[tasks.typecheck-pipelines]
run = "uv run pyright"
dir = "pipelines"
description = "Run pyright type checker on pipelines"

[tasks.tfe]
run = "npm test"
dir = "pipelines/src/frontend"

###################################################
## 🚀✨ Scripts                             ✨🚀 ##
###################################################

[tasks.script]
description = "Run a one-off script: mise run script -- <script_name> [args]"
run = "uv run python scripts/{{ arg(name=\"script\") }}.py {{ args() }}"

###################################################
## 🚀✨ Worker                              ✨🚀 ##
###################################################

[tasks.dev]
description = "Start the full local stack: Supabase CLI (auth + inbucket + minimal services per civicpatch.org/supabase/config.toml) + docker compose with worker hot-reload. Ctrl+C tears both layers down."
run = """
set -e
cleanup_ran=0
cleanup() {
  [ "$cleanup_ran" = 1 ] && return
  cleanup_ran=1
  printf '\\n━━━ Tearing down dev stack ━━━\\n'
  printf '→ supabase stop\\n'
  (cd civicpatch.org && supabase stop) >/dev/null 2>&1 || true
  printf '→ docker compose down\\n'
  docker compose down >/dev/null 2>&1 || true
  printf '✓ All stopped\\n'
}
trap cleanup INT TERM EXIT
printf '━━━ Starting Supabase (local) ━━━\\n'
(cd civicpatch.org && supabase start)
# Pick up the CLI-generated SECRET_KEY so the backend uses the real local key
# (not the docker-compose fallback string). It's a shared default — not secret,
# but it can change between CLI versions. The browser never sees this key.
eval "$(cd civicpatch.org && supabase status -o env 2>/dev/null | grep -E '^SECRET_KEY=')"
export SUPABASE_SECRET_KEY="$SECRET_KEY"
printf '\\n━━━ Starting civicpatch stack ━━━\\n'
printf 'Inbucket UI:  http://localhost:54324  (captured OTP emails)\\n'
printf 'Supabase:     http://localhost:54321\\n'
printf 'civicpatch:   http://localhost:8000\\n\\n'
docker compose up --watch
"""

[tasks.watch-worker]
description = "Hot-reload the Temporal worker when worker or shared code changes"
run = "watchfiles --filter python 'docker compose restart worker civicpatch-org-worker' worker/src/ civicpatch.org/src/ shared/src/shared/"

[tasks.otp]
description = "Print the most recent OTP code captured by local Supabase's Mailpit (port 54324). Useful when the Mailpit UI isn't reachable in the browser."
run = """
curl -sf http://localhost:54324/api/v1/message/latest \\
  | python3 -c "import sys, json, re; body = json.load(sys.stdin).get('Text', ''); match = re.search(r'\\\\b(\\\\d{6})\\\\b', body); print(match.group(1) if match else 'no 6-digit code found in latest message')"
"""

###################################################
## 🚀✨ DATABASE COMMANDS (for development) ✨🚀 ##
###################################################

[tasks.migrate_up]
run = """
docker compose run --rm civicpatch-org \
    python database_operations/migrate.py up
"""

[tasks.migrate_down]
run = """
docker compose run --rm civicpatch-org \
    python database_operations/migrate.py down
"""

[tasks.psql]
description = "Open a psql shell against the dev database"
run = "docker compose exec civicpatch-org-db psql -U civicpatch -d development_db"

[tasks.jurisdictions-tsv]
description = "Dump jurisdictions table with flattened data column as TSV. Optionally filter by state: mise run jurisdictions-tsv -- tx"
run = """
STATE="{{ arg(name="state", required=false) }}"
FILTER=""
if [ -n "$STATE" ]; then
  FILTER="WHERE state = '$STATE'"
fi
docker compose exec -T civicpatch-org-db psql -U civicpatch -d development_db \
  --no-align --field-separator $'\\t' --tuples-only \
  -c "
    SELECT
        jurisdiction_ocdid,
        state,
        status,
        data->>'id'         AS data_id,
        data->>'name'       AS data_name,
        data->>'url'        AS data_url,
        data->>'geoid'      AS data_geoid,
        data->>'population' AS data_population,
        file_path,
        git_commit,
        updated_at
    FROM jurisdictions
    $FILTER
    ORDER BY jurisdiction_ocdid;
  "
"""
