[tasks.tlive]
description = "Run live scrape tests locally (hits real external URLs, never run in CI — runs headless=False so the browser is visible)"
run = "uv run pytest tests/integration -m live -s -v"
dir = "pipelines"

[tasks.tcpi]
description = "Run pipelines integration tests inside Docker (requires spaCy, Playwright)"
run = "docker compose -f pipelines/docker-compose-files/docker-compose.integration-tests.yml run --rm pipelines-integration-tests"

[tasks.evalsm]
# -s disables pytest's stdout capture. Without it the run is silent for minutes:
# both the per-case progress lines and PipelineRunLogger's retry warnings go to stdout,
# and pytest buffers them until the test ends.
run = "uv run pytest -s tests/prompts/tests/evals/test_local_municipal_officials_eval.py"
dir = "pipelines"

[tasks.evalsr]
# -s: see the note on evalsm
run = "uv run pytest -s tests/prompts/tests/evals/test_local_relevant_page_eval.py"
dir = "pipelines"

[tasks.evals]
# -s: see the note on evalsm
run = "uv run pytest -s -m evals tests/prompts"
dir = "pipelines"

[tasks.evalsd]
run = "uv run pytest tests/prompts/tests/evals/test_find_jurisdiction_url_eval.py"
dir = "pipelines"


[tasks.e2e-install]
description = "Install e2e dependencies and Playwright browsers (run once)"
run = "npm install && npx playwright install chromium"
dir = "e2e"

[tasks.e2e]
description = "Build frontend, start e2e stack, open Playwright UI — tears down on exit"
run = """
set -e
npm install
npx playwright install chromium
cd ../civicpatch.org/src/frontend && npm install && npm run build
cd - > /dev/null
docker compose -f ../docker-compose.e2e.yml -f ../docker-compose.e2e.local.yml up db-e2e redis-e2e civicpatch-org-e2e -d --wait
npx playwright test --ui --ui-host=0.0.0.0 --ui-port=8123 || true
docker compose -f ../docker-compose.e2e.yml -f ../docker-compose.e2e.local.yml down -v --remove-orphans
"""
dir = "e2e"
env = { BASE_URL = "http://localhost:8100", E2E_DB_URL = "postgres://e2e:e2e_password@localhost:8101/e2e_db", E2E_REDIS_HOST = "localhost", E2E_REDIS_PORT = "8102" }

[tasks.visual]
description = "Screenshot every page in both themes and diff against the committed baseline"
run = """
set -e
cd ../civicpatch.org/src/frontend && npm run build
cd - > /dev/null
docker compose -f ../docker-compose.e2e.yml -f ../docker-compose.e2e.local.yml up db-e2e redis-e2e civicpatch-org-e2e -d --wait
# The backend caches the Vite manifest at startup, so a rebuild without this
# serves a stale bundle and every baseline is wrong for the wrong reason.
docker compose -f ../docker-compose.e2e.yml -f ../docker-compose.e2e.local.yml restart civicpatch-org-e2e
# `restart` returns before the app is serving, so without this playwright opens on a
# dead port and fails on unrelated pages — six captures, six different "errors".
until [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/login" --max-time 5)" = "200" ]; do sleep 2; done
npx playwright test --config=playwright.visual.config.js
"""
dir = "e2e"
env = { BASE_URL = "http://localhost:8100", E2E_DB_URL = "postgres://e2e:e2e_password@localhost:8101/e2e_db", E2E_REDIS_HOST = "localhost", E2E_REDIS_PORT = "8102" }

[tasks.visual-update]
description = "Accept the current rendering as the new visual baseline — only when a change is intended"
run = """
set -e
cd ../civicpatch.org/src/frontend && npm run build
cd - > /dev/null
docker compose -f ../docker-compose.e2e.yml -f ../docker-compose.e2e.local.yml up db-e2e redis-e2e civicpatch-org-e2e -d --wait
docker compose -f ../docker-compose.e2e.yml -f ../docker-compose.e2e.local.yml restart civicpatch-org-e2e
# See `visual`: restart returns before the app serves.
until [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/login" --max-time 5)" = "200" ]; do sleep 2; done
# =all, not the bare flag: on 1.50 the bare form reports pass and writes nothing.
npx playwright test --config=playwright.visual.config.js --update-snapshots=all
"""
dir = "e2e"
env = { BASE_URL = "http://localhost:8100", E2E_DB_URL = "postgres://e2e:e2e_password@localhost:8101/e2e_db", E2E_REDIS_HOST = "localhost", E2E_REDIS_PORT = "8102" }

[tasks.e2e-spec]
description = "Run one e2e spec headless against an already-running stack: mise run e2e-spec -- tests/foo.spec.js"
run = "npx playwright test --reporter=line"
dir = "e2e"
env = { BASE_URL = "http://localhost:8100", E2E_DB_URL = "postgres://e2e:e2e_password@localhost:8101/e2e_db", E2E_REDIS_HOST = "localhost", E2E_REDIS_PORT = "8102" }

[tasks.e2e-ci]
description = "Run Playwright e2e tests headless in a fully isolated Docker stack (for CI)"
run = """
docker compose -f docker-compose.e2e.yml down -v --remove-orphans || true
docker compose -f docker-compose.e2e.yml build civicpatch-org-e2e
# The status is captured rather than piped: a `| grep` makes $? grep's, so this task reported
# success on a suite with 24 failures. `set -o pipefail` is not available — mise runs tasks
# under sh, not bash.
log=$(mktemp)
status=0
docker compose -f docker-compose.e2e.yml up --exit-code-from playwright --abort-on-container-exit > "$log" 2>&1 || status=$?
grep -E "^(playwright-1|ERROR|civicpatch-e2e)" "$log" || true
rm -f "$log"
exit $status
"""


[tasks.tcp]
run = "uv run pytest -m unit"
dir = "civicpatch.org"

[tasks.tcp-db-up]
description = "Start the integration test database and wait until healthy"
run = "docker compose -f civicpatch.org/docker-compose.integration.yml up -d --wait"

[tasks.tcp-db-down]
description = "Stop and remove the integration test database"
run = "docker compose -f civicpatch.org/docker-compose.integration.yml down -v"

[tasks.tcp-db-migrate]
description = "Apply all migrations to the integration test database"
run = """
env \
  CIVICPATCH_API_DB_URL=postgres://civicpatch:test_password@127.0.0.1:6001/test_db \
  CIVICPATCH_API_DB_PASSWORD=test_password \
  GITHUB_APP_ID=x GITHUB_APP_PRIVATE_KEY_BASE64=x GITHUB_APP_INSTALLATION_ID=x \
  SUPABASE_URL=x SUPABASE_SECRET_KEY=x \
  INSTANCE_URL=x OPEN_DATA_REPO_URL=x MAINTAINER_EMAIL=x \
  REDIS_HOST=x DATABASE_HASH_KEY=x SERVICE_API_KEY=x COOKIE_INSTANCE_URL=x \
  uv run python database_operations/migrate.py up
"""
dir = "civicpatch.org"

[tasks.tcp-integration]
description = "Start test DB, migrate, run integration tests. The DB is left up."
# Deliberately no teardown: `tcp-db-down` drops the volume, so the next run replays every
# migration. Tests own their cleanup instead — see `_wipe()` and `_cleanup_open_pr`.
#
# The cost of that bargain: a test which writes to shared tables and does not clean up leaves
# residue that fails *other* tests on later runs, looking like a spreading breakage. If results
# stop making sense, run `tcp-integration-fresh`.
run = """
set -e
mise run tcp-db-up
mise run tcp-db-migrate
mise run tcp -- -m integration
"""

[tasks.tcp-integration-fresh]
description = "Integration tests against a brand-new database. Slower; use when residue is suspected."
run = """
set -e
mise run tcp-db-down
mise run tcp-integration
"""

[tasks.typecheck-fe]
run = "npm run typecheck"
dir = "civicpatch.org/src/frontend"
description = "Run TypeScript typecheck on civicpatch.org frontend"

[tasks.typecheck-cp]
run = "uv run pyright"
dir = "civicpatch.org"
description = "Run pyright type checker on civicpatch.org"

[tasks.typecheck-pipelines]
