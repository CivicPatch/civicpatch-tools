[tasks.sheet_sync]
description = "Re-sync one state's sheet tabs now, or every state with no argument"
# Literal ''' string, not """: TOML processes escapes in basic strings, so \" there reaches
# the shell as a bare quote and curl gets three concatenated fragments instead of JSON.
run = '''
    curl -X POST "http://localhost:8000/api/admin/sheet_sync/rosters" \
      -H "Content-Type: application/json" \
      -H "Authorization: $SERVICE_API_KEY" \
      -d "{\"state\": \"${state:-}\"}"
'''

[tasks.sheet_sync_jurisdictions]
description = "Refresh the sheet's all-states jurisdiction dropdown source"
run = """
    curl -X POST "http://localhost:8000/api/admin/sheet_sync/jurisdictions" \
      -H "Content-Type: application/json" \
      -H "Authorization: $SERVICE_API_KEY"
"""

[tasks.pr_sync]
run = """
    curl -X POST "http://localhost:8000/api/admin/pr_sync" \
      -H "Content-Type: application/json" \
