[tools]
pre-commit = "latest"
python = "3.12"
uv = "latest"
postgres = "17.3"
redis = "latest"

[env]
_.file = [
    "../civicpatch.env",
    "../api.civicpatch.org.env"
]

[tasks.setup]
run = "mise install && pre-commit install && uv sync --all-packages"
description = "Install all workspace dependencies"

[tasks.pytest-shared]
run = "uv run pytest"
dir = "shared"

[tasks.tcp]
run = "uv run pytest tests/unit"
dir = "civicpatch"

[tasks.tapi]
run = "uv run pytest"
dir = "api.civicpatch.org"