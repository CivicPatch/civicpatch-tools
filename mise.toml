[tools]
pre-commit = "latest"
python = "3.12"
uv = "latest"
node = "25.8"
gh = "latest"
gcloud = "latest"
jq = "latest"
supabase = "2.98.0"
infisical = "latest"

[env]
_.file = ["../pipelines.env", "../civicpatch.org.env"]
# Local-dev value. Matches what the FastAPI app expects when not overridden
# by docker-compose / .env. Production uses $PROD_SERVICE_API_KEY (from secrets).
SERVICE_API_KEY = "service-api-key"

# The data-entry spreadsheet. Same default as civicpatch.org/docker-compose.yml:44 and 154, and
# as scripts/apps-script/entry-sheet-setup.gs — three copies, because Apps Script runs inside
# Google and cannot read either of the others. Change the dev sheet in all three or the script
# will set up a spreadsheet the stack never reads.
# Not a secret: access is Drive sharing, not knowing the string.
# https://docs.google.com/spreadsheets/d/11xjGyzgOJAZX2bT5Ed61gHdXS8_atLuomzOKHxv2xr4
ENTRY_SPREADSHEET_ID = "11xjGyzgOJAZX2bT5Ed61gHdXS8_atLuomzOKHxv2xr4"


[tasks.setup]
run = "mise install && pre-commit install && pre-commit install --hook-type pre-push && uv sync --all-packages"
description = "Install all workspace dependencies"

