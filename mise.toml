[tools]
pre-commit = "latest"
python = "3.12"
uv = "latest"
postgres = "17.3"
redis = "latest"
node = "25.8"

[env]
_.file = [
    "../civicpatch.env",
    "../civicpatch.org.env"
]

[tasks.setup]
run = "mise install && pre-commit install && uv sync --all-packages"
description = "Install all workspace dependencies"

###################################################
## 🚀✨ Syncs                                ✨🚀 ##
###################################################

[tasks.pr_sync]
run = """
    curl -X POST "http://localhost:8001/api/admin/pr_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: $SERVICE_API_KEY"
"""

[tasks.pr_sync_prod]
run = """
    curl -X POST "https://civicpatch.org/api/admin/pr_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: $PROD_SERVICE_API_KEY"
"""

[tasks.od_sync]
run = """
    curl -X POST "http://localhost:8001/api/admin/od_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: $SERVICE_API_KEY" \
      -d '{}'
"""
      #\
      # -d '{"jurisdiction_ocdids": ["ocd-jurisdiction/country:us/state:tx/place:combes/government"]}'

[tasks.od_sync_prod]
run = """
    curl -X POST "https://civicpatch.org/api/admin/od_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: $PROD_SERVICE_API_KEY" \
      -d '{}'
"""


[tasks.clear_dashboard_cache]
run = """
    curl -X POST "http://localhost:8001/api/admin/clear_dashboard_cache" \
      -H "Content-Type: application/json" \
      -H "Authorization: $SERVICE_API_KEY"
"""

[tasks.clear_dashboard_cache_prod]
run = """
    curl -X POST "https://civicpatch.org/api/admin/clear_dashboard_cache" \
      -H "Content-Type: application/json" \
      -H "Authorization: $PROD_SERVICE_API_KEY"
"""


###################################################
## 🚀✨ Tests                                ✨🚀 ##
###################################################

[tasks.pytest-shared]
run = "uv run pytest"
dir = "shared"

[tasks.tcp]
run = "uv run pytest tests/unit"
dir = "pipelines"

[tasks.tcpi]
description = "Run pipelines integration tests inside Docker (requires spaCy, Playwright)"
run = "docker compose -f pipelines/docker-compose-files/docker-compose.integration-tests.yml run --rm pipelines-integration-tests"

[tasks.evalsm]
run = "uv run pytest tests/prompts/tests/evals/test_local_municipal_officials_eval.py"
dir = "pipelines"

[tasks.evalsr]
run = "uv run pytest tests/prompts/tests/evals/test_local_relevant_page_eval.py"
dir = "pipelines"

[tasks.evals]
run = "uv run pytest -m evals tests/prompts"
dir = "pipelines"

[tasks.tapi]
run = "uv run pytest"
dir = "civicpatch.org"

[tasks.tapi-db-up]
description = "Start the integration test database and wait until healthy"
run = "docker compose -f civicpatch.org/docker-compose.integration.yml up -d --wait"

[tasks.tapi-db-down]
description = "Stop and remove the integration test database"
run = "docker compose -f civicpatch.org/docker-compose.integration.yml down -v"

[tasks.tapi-db-migrate]
description = "Apply all migrations to the integration test database"
run = """
env \
  CIVICPATCH_API_DB_URL=postgres://civicpatch:test_password@127.0.0.1:6001/test_db \
  CIVICPATCH_API_DB_PASSWORD=test_password \
  GITHUB_APP_ID=x GITHUB_APP_CLIENT_ID=x GITHUB_APP_CLIENT_SECRET=x \
  GITHUB_APP_PRIVATE_KEY_BASE64=x GITHUB_APP_INSTALLATION_ID=x \
  INSTANCE_URL=x OPEN_DATA_REPO_URL=x MAINTAINER_EMAIL=x \
  REDIS_HOST=x DATABASE_HASH_KEY=x SERVICE_API_KEY=x COOKIE_INSTANCE_URL=x \
  uv run python database_operations/migrate.py up
"""
dir = "civicpatch.org"

[tasks.tapi-integration]
description = "Start test DB, migrate, run integration tests, tear down"
run = """
set -e
mise run tapi-db-up
mise run tapi-db-migrate
mise run tapi -- -m integration
"""

[tasks.typecheck]
run = "uv run pyright"
dir = "civicpatch.org"
description = "Run pyright type checker on civicpatch.org"

[tasks.typecheck-worker]
run = "uv run pyright"
dir = "worker"
description = "Run pyright type checker on worker"

[tasks.typecheck-pipelines]
run = "uv run pyright"
dir = "pipelines"
description = "Run pyright type checker on pipelines"

[tasks.tfe]
run = "npm test"
dir = "pipelines/src/frontend"

###################################################
## 🚀✨ Scripts                             ✨🚀 ##
###################################################

[tasks.script]
description = "Run a one-off script: mise run script -- <script_name> [args]"
run = "uv run python scripts/{{ arg(name=\"script\") }}.py {{ args() }}"

[tasks.regenerate-review-json]
description = "One-off: regenerate review_json for all requests using current DB people as research baseline"
run = """
read -p "DB URL [postgres://civicpatch:development_password@127.0.0.1:6000/development_db]: " url
CIVICPATCH_API_DB_URL="${url:-postgres://civicpatch:development_password@127.0.0.1:6000/development_db}" \
  uv run python scripts/regenerate_review_json.py
"""

###################################################
## 🚀✨ DATABASE COMMANDS (for development) ✨🚀 ##
###################################################

[tasks.migrate_up]
run = """
docker compose run --rm civicpatch-org \
    python database_operations/migrate.py up
"""

[tasks.migrate_down]
run = """
docker compose run --rm civicpatch-org \
    python database_operations/migrate.py down
"""

[tasks.psql]
description = "Open a psql shell against the dev database"
run = "psql postgres://civicpatch:development_password@127.0.0.1:6000/development_db"

[tasks.jurisdictions-tsv]
description = "Dump jurisdictions table with flattened data column as TSV. Optionally filter by state: mise run jurisdictions-tsv -- tx"
run = """
STATE="{{ arg(name="state", required=false) }}"
FILTER=""
if [ -n "$STATE" ]; then
  FILTER="WHERE state = '$STATE'"
fi
psql postgres://civicpatch:development_password@127.0.0.1:6000/development_db \
  --no-align --field-separator $'\\t' --tuples-only \
  -c "
    SELECT
        jurisdiction_ocdid,
        state,
        status,
        data->>'id'         AS data_id,
        data->>'name'       AS data_name,
        data->>'url'        AS data_url,
        data->>'geoid'      AS data_geoid,
        data->>'population' AS data_population,
        file_path,
        git_commit,
        updated_at
    FROM jurisdictions
    $FILTER
    ORDER BY jurisdiction_ocdid;
  "
"""
