[tools]
pre-commit = "latest"
python = "3.12"
uv = "latest"
postgres = "17.3"
redis = "latest"

[env]
_.file = [
    "../civicpatch.env",
    "../api.civicpatch.org.env"
]

[tasks.setup]
run = "mise install && pre-commit install && uv sync --all-packages"
description = "Install all workspace dependencies"


###################################################
## 🚀✨ Tests                                ✨🚀 ##
###################################################

[tasks.pytest-shared]
run = "uv run pytest"
dir = "shared"

[tasks.tcp]
run = "uv run pytest tests/unit"
dir = "civicpatch"

[tasks.tapi]
run = "uv run pytest"
dir = "api.civicpatch.org"

###################################################
## 🚀✨ DATABASE COMMANDS (for development) ✨🚀 ##
###################################################

[tasks.migrate_up]
run = """
docker compose run --rm api_civicpatch_org \
    python database_operations/migrate.py up
"""

[tasks.migrate_down]
run = """
docker compose run --rm api_civicpatch_org \
    python database_operations/migrate.py down
"""
