###################################################
## 🚀✨ Worker                              ✨🚀 ##
###################################################

[tasks.dev]
description = "Start the full local stack: Supabase CLI (auth + inbucket + minimal services per civicpatch.org/supabase/config.toml) + docker compose with worker hot-reload. Ctrl+C tears both layers down."
run = """
set -e
cleanup_ran=0
cleanup() {
  [ "$cleanup_ran" = 1 ] && return
  cleanup_ran=1
  printf '\\n━━━ Tearing down dev stack ━━━\\n'
  printf '→ supabase stop\\n'
  (cd civicpatch.org && supabase stop) >/dev/null 2>&1 || true
  printf '→ docker compose down\\n'
  docker compose down >/dev/null 2>&1 || true
  printf '✓ All stopped\\n'
}
trap cleanup INT TERM EXIT
printf '━━━ Starting Supabase (local) ━━━\\n'
(cd civicpatch.org && supabase start)
# Pick up the CLI-generated SECRET_KEY so the backend uses the real local key
# (not the docker-compose fallback string). It's a shared default — not secret,
# but it can change between CLI versions. The browser never sees this key.
eval "$(cd civicpatch.org && supabase status -o env 2>/dev/null | grep -E '^SECRET_KEY=')"
export SUPABASE_SECRET_KEY="$SECRET_KEY"
printf '\\n━━━ Starting civicpatch stack ━━━\\n'
printf 'Inbucket UI:  http://localhost:54324  (captured OTP emails)\\n'
printf 'Supabase:     http://localhost:54321\\n'
printf 'civicpatch:   http://localhost:8000\\n\\n'
docker compose up --watch
"""

[tasks.watch-worker]
description = "Hot-reload both Temporal workers when civicpatch.org or shared code changes"
run = "watchfiles --filter python 'docker compose restart civicpatch-org-sinks civicpatch-org-jurisdictions civicpatch-org-expiry civicpatch-org-scrape' civicpatch.org/src/ shared/src/shared/"

[tasks.otp]
description = "Print the most recent OTP code captured by local Supabase's Mailpit (port 54324). Useful when the Mailpit UI isn't reachable in the browser."
run = """
curl -sf http://localhost:54324/api/v1/message/latest \\
  | python3 -c "import sys, json, re; body = json.load(sys.stdin).get('Text', ''); match = re.search(r'\\\\b(\\\\d{6})\\\\b', body); print(match.group(1) if match else 'no 6-digit code found in latest message')"
"""

###################################################
## 🚀✨ DATABASE COMMANDS (for development) ✨🚀 ##
###################################################

[tasks.migrate_up]
run = """
docker compose run --rm civicpatch-org \
    python database_operations/migrate.py up
"""

[tasks.migrate_down]
description = "Roll back N migrations, newest first (default 1): mise run migrate_down -- 4"
# The container entrypoint runs `migrate up` before the command, so a bare `down` in a fresh
# container applies everything and then undoes one. Running it repeatedly therefore rolls back
# the *same* migration each time instead of walking backwards — pass a count to move.
run = """
docker compose run --rm civicpatch-org \
    python database_operations/migrate.py down {{ arg(name="steps", required=false) }}
"""

[tasks.psql]
description = "Open a psql shell against the dev database"
run = "docker compose exec civicpatch-org-db psql -U civicpatch -d development_db"

[tasks.jurisdictions-tsv]
description = "Dump jurisdictions table with flattened data column as TSV. Optionally filter by state: mise run jurisdictions-tsv -- tx"
run = """
STATE="{{ arg(name="state", required=false) }}"
FILTER=""
if [ -n "$STATE" ]; then
  FILTER="WHERE state = '$STATE'"
fi
docker compose exec -T civicpatch-org-db psql -U civicpatch -d development_db \
  --no-align --field-separator $'\\t' --tuples-only \
  -c "
    SELECT
        jurisdiction_ocdid,
        state,
        status,
        data->>'id'         AS data_id,
        data->>'name'       AS data_name,
        data->>'url'        AS data_url,
        data->>'geoid'      AS data_geoid,
        data->>'population' AS data_population,
        file_path,
        git_commit,
        updated_at
    FROM jurisdictions
    $FILTER
    ORDER BY jurisdiction_ocdid;
  "
"""

[tasks.evals-report]
description = "Render one HTML dashboard from the eval reports already on disk (no LLM calls)"
run = "PYTHONPATH=src:tests/prompts/tests/evals uv run python tests/prompts/tests/evals/visualize.py"
# Also regenerated automatically at the end of every eval run — see the evals conftest.
dir = "pipelines"

[tasks.evals-audit]
description = "Flag fixture defects by cross-provider agreement (no LLM calls)"
run = "PYTHONPATH=src:tests/prompts/tests/evals uv run python tests/prompts/tests/evals/audit_fixtures.py"
dir = "pipelines"

[tasks.evals-serve]
# file:// is awkward — editors show HTML as source rather than rendering it, and a browser
# tab opened before a regeneration serves the stale copy. Serving it sidesteps both.
# 8200 avoids the ports already in use here (8000, 8100-8102, 8123).
description = "Regenerate the eval dashboard and serve it at http://localhost:8200"
run = """
PYTHONPATH=src:tests/prompts/tests/evals uv run python tests/prompts/tests/evals/visualize.py
# Served from tests/prompts, not the evals dir: the dashboard links each failing case to
# its datasets/local/<case>/input.md, and a root inside tests/evals would put those outside
# the served tree (http.server blocks the traversal).
cd tests/prompts
URL=http://localhost:8200/tests/evals/dashboard.html
echo ""
echo "  Dashboard: $URL"
echo "  Ctrl-C to stop"
echo ""
(command -v xdg-open >/dev/null 2>&1 && sleep 1 && xdg-open "$URL" >/dev/null 2>&1 &)
uv run python -m http.server 8200 --bind 127.0.0.1
"""
dir = "pipelines"
