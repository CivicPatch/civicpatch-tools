repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: tour-staleness-reminder
        name: Check .tour files for stale steps
        language: system
        entry: scripts/tour_staleness_reminder.sh
        pass_filenames: false
        always_run: true
      - id: css-tiers
        name: Check CSS tiers (no primitives in components, no retired token names)
        language: system
        entry: scripts/check_css_tiers.py
        pass_filenames: false
        files: '\.(css|ts)$'
      - id: run-tests
        name: Run unit tests
        language: system
        entry: scripts/run_tests.sh
        pass_filenames: false
      - id: run-integration-tests
        name: Run integration tests
        language: system
        entry: scripts/run_integration_tests.sh
        pass_filenames: false
        stages: [pre-push]
