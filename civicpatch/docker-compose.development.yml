services:
  civicpatch-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development-fe
    volumes:
      - ./src/frontend:/app
      - /app/src/frontend/node_modules
    networks:
      - civicpatch_net

  civicpatch:
    environment:
      - PIPELINE_RUN_COST_LIMIT

      - BRAVE_SEARCH_TOKEN
      - GOOGLE_SEARCH_TOKEN
      - GOOGLE_SEARCH_ENGINE_ID
      - SERP_API_SEARCH_TOKEN

      - GOOGLE_GEMINI_TOKEN
      - OPENAI_TOKEN
      - TOGETHER_AI_TOKEN

      - CRUDDER_SHARED_TOKEN
      - CRUDDER_URL

      - LOG_LEVEL

      - GOOGLE_SHEETS_SPREADSHEET_ID
      - GOOGLE_SHEETS_PRIVATE_KEY
      - GOOGLE_SHEETS_CLIENT_EMAIL
      - GOOGLE_SHEETS_TOKEN_URI
    init: true # https://stackoverflow.com/questions/50634819/xvfb-run-hangs-in-container
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      # target: image-base
    restart: unless-stopped
    ports:
      - "8000:8000"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data:/app/data
      - ./data_source:/app/data_source
      - .:/app
    networks:
      - civicpatch_net
    # temporary
    # network_mode: host

volumes:
  exclude:

networks:
  civicpatch_net:
    driver: bridge
