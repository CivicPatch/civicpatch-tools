services:
  civicpatch-slim:
    env_file: .env
    init: true # https://stackoverflow.com/questions/50634819/xvfb-run-hangs-in-container
    image: ghcr.io/civicpatch/civicpatch-slim:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../data_source:/app/data_source
      - .:/app