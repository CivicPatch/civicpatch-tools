thought: The user requested information on elected officials. I iterated through the
  'Board of Aldermen' section. For each official, I extracted their name, role, image
  URL, email, phone number (if explicitly present next to their name), and their term
  start and end dates. I formatted the dates to YYYY-MM. I skipped one entry for an
  'Alderman' where the name was not explicitly stated, only derivable from the email,
  to adhere strictly to the 'Do NOT infer or fabricate any details' guideline. I also
  noted that no specific designation types like ward or district were present.
