thought: The source is the official Town of Rancho Viejo website's Board of Aldermen
  page, listing the officials with photos, roles, emails, phones, and term periods.
  The roster appears current as of 2026 and terms stretch into 2027. I extracted full
  names, roles, terms, contact info, and images where available. The phone number
  956-350-4093 is used primarily as the main office contact and also by the Mayor
  Todd Day individually. The emails follow the standard town email format. No wards,
  districts or designations were specified for the officials, so designations arrays
  are left empty.
