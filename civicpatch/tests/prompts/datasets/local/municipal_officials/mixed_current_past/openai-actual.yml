thought: The City of Leonard's current governing body includes a Mayor, a Mayor Pro
  Tem, and five Council Members. From the content, the council members and mayor serve
  at-large positions. The terms for positions elected on even years (Mayor, Mayor
  Pro Tem, and one Council Member) end in 2026, while terms for positions elected
  on odd years (three Council Members) end in 2027. Phone number 903-587-3334 and
  cityadmin@cityofleonard.net are the main contact details used for all officials
  as no individual contact info was provided. The start date for the current term
  is inferred as 2025 based on election cycles, and end dates correspond to the filing
  deadline dates provided in the source, interpreted as the term end dates. The profile
  image used is the group image from the 2025 new council members section.
