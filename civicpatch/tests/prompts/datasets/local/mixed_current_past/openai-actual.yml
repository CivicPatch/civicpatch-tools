thought: The website provides the current City Council roster of Leonard, Texas, listing
  the Mayor, Mayor Pro Tem, and Council Members with their roles and deadlines to
  file for candidacy. The City Council positions are At Large. The city phone (903-587-3334),
  general city admin email, and council webpage URL have been extracted and assigned
  to officials. Images for the 2025 council members are from the provided group photo
  of new council members; no individual profile images were available. Start dates
  are inferred around 2025 based on the note about 2025 council members, with applicable
  end dates extracted from the candidacy deadlines table and text.
