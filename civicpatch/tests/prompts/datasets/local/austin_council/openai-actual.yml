thought: The page contains a structured table listing the Mayor and City Council members
  with their roles (Mayor or District X Council Member) and phone numbers. Per instructions,
  I extracted only officials from that structured listing and did not include anyone
  mentioned elsewhere on the page. The table provides names, role labels, district
  divisions (for council members), contact URLs for each entry, and phone numbers;
  it does not include emails, images, or term dates, so those fields are left null.
  Extraction is limited to the explicit structured listing and current as of the page's
  context (the site references an organizational chart dated January 2026).
