<!doctype html>

<html>
    <head>
        <title>{% block title %}civicpatch tool{% endblock %}</title>

        <link
            href="{{ url_for('frontend', path='/css/pico.min.css') }}"
            rel="stylesheet"
        />
        <link
            href="{{ url_for('frontend', path='/css/styles.css') }}"
            rel="stylesheet"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
        <script src="https://kit.fontawesome.com/ac3d436b83.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <main class="container-fluid">
            {% block content %}{% endblock %}
        </main>

        {% if is_production %}
        <!-- Production: bundled files (Rollup) -->
        <script type="importmap">
            {
                "imports": {
                    "@components": "https://components.civicpatch.org/bundle.js"
                }
            }
        </script>
        <script
            type="module"
            src="{{ url_for('frontend', path='/dist/bundle.js') }}"
        ></script>

        {{ url_for('frontend', path='/dist/bundle.js') }}

        {% else %}
        <!-- Hot reload script -->
        {{ hot_reload.script(url_for('hot-reload')) | safe }}
        <!-- Development: rollup handles module resolution -->
        <script type="importmap">
            {
                "imports": {
                    "@components": "{{ url_for('frontend', path='/cdn/bundle.js') }}"
                }
            }
        </script>
        <script
            type="module"
            src="{{ url_for('frontend', path='/build/bundle.js') }}"
        ></script>


        <!--<script type="module" src="/dev-modules/build/bundle.js"></script>-->
        {% endif %}
    </body>
</html>
