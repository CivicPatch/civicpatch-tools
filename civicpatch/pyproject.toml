[project]
name = "civicpatch"
version = "0.1.0"
description = ""
authors = [
    {name = "Michelle",email = "michelle@civicpatch.org"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "bs4 (>=0.0.2,<0.0.3)",
    "markdownify (>=1.1.0,<2.0.0)",
    "pytest (>=8.4.1,<9.0.0)",
    "spacy (>=3.8.7,<4.0.0)",
    "playwright (>=1.54.0,<2.0.0)",
    "pytest-playwright (>=0.7.0,<0.8.0)",
    "pytest-rerunfailures (>=15.1,<16.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "openai (>=1.99.6,<2.0.0)",
    "instructor (>=1.10.0,<2.0.0)",
    "nameparser (>=1.1.3,<2.0.0)",
    "google-genai (>=1.29.0,<2.0.0)",
    "jsonref (>=1.1.0,<2.0.0)",
    "python-levenshtein (>=0.27.1,<0.28.0)",
    "together (>=1.5.25,<2.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "fastapi[standard] (>=0.116.1,<0.117.0)",
    "boto3 (>=1.40.35,<2.0.0)",
    "phonenumbers (>=9.0.14,<10.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "google-api-python-client (>=2.184.0,<3.0.0)",
    "aiofiles (>=24.1.0,<25.0.0)",
]

[tool.poetry]
packages = [
    { include = "src" }
]

[tool.poetry.scripts]
post-install = "setup:post_install"
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
