services:
  civicpatch-cicd:
    environment:
      - PIPELINE_RUN_COST_LIMIT

      - GOOGLE_SEARCH_TOKEN
      - GOOGLE_SEARCH_ENGINE_ID

      - GOOGLE_GEMINI_TOKEN
      - TOGETHER_AI_TOKEN

      - SERVICE_API_KEY
      - CIVICPATCH_ORG_URL

      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    init: true # https://stackoverflow.com/questions/50634819/xvfb-run-hangs-in-container
    #image: ghcr.io/civicpatch/civicpatch-github-actions:latest
    build:
      context: ../..
      dockerfile: civicpatch/Dockerfile.github-actions
    volumes:
      - ../data:/app/data
      - ../data_source:/app/data_source
