services:
  civicpatch_app:
    env_file: .env
    init: true # https://stackoverflow.com/questions/50634819/xvfb-run-hangs-in-container
    build:
      context: ..
      dockerfile: civicpatch/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../shared:/app/shared:ro  # Mount shared library
      - .:/app