services:
  civicpatch:
    environment:
      - PIPELINE_RUN_COST_LIMIT

      - BRAVE_SEARCH_TOKEN
      - GOOGLE_SEARCH_TOKEN
      - GOOGLE_SEARCH_ENGINE_ID
      - SERP_API_SEARCH_TOKEN

      - GOOGLE_GEMINI_TOKEN
      - OPENAI_TOKEN
      - TOGETHER_AI_TOKEN

      - CRUDDER_SHARED_TOKEN
      - CRUDDER_URL

      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    init: true # https://stackoverflow.com/questions/50634819/xvfb-run-hangs-in-container
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    #  target: production
    image: ghcr.io/civicpatch/civicpatch:latest
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./data_source:/app/data_source
