services:
  civicpatch:
    environment:
      - BRAVE_SEARCH_TOKEN
      - GOOGLE_SEARCH_TOKEN
      - GOOGLE_SEARCH_ENGINE_ID
      - SERP_API_TOKEN

      - GOOGLE_GEMINI_TOKEN
      - OPENAI_TOKEN
      - TOGETHER_AI_TOKEN

      - CRUDDER_SHARED_TOKEN
      - CRUDDER_URL
    init: true # https://stackoverflow.com/questions/50634819/xvfb-run-hangs-in-container
    image: ghcr.io/civicpatch/civicpatch:${DOCKER_TAG:-latest}
    ports:
      - "8000:8000"
    user: "${UID}:${GID}"
    volumes:
      - ../data:/app/data
      - ../data_source:/app/data_source