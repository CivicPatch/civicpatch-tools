[tools]
poetry = { version="latest", pyproject="{{ config_root }}/pyproject.toml" }
python = "3.12.11" # must be after poetry so the poetry bin is first in PATH
node = "24.11.0"

[env]
_.file = ".env"
POETRY_VIRTUALENVS_IN_PROJECT = true
PYTHONPATH = "./src"

#[tasks.unit]
#run = "docker compose run --rm civicpatch poetry run pytest -s tests/unit"
#[tasks.integration]
#run = "docker compose run --rm civicpatch poetry run pytest -s tests/integration"
###################################################
## 🚀✨ DEVELOPMENT TASKS ✨🚀
###################################################
[tasks.container]
run = "docker compose -f docker-compose.development.yml run --rm civicpatch"
[tasks.containsh]
run = "docker compose -f docker-compose.development.yml exec civicpatch bash"
[tasks.containsh-fe]
run = "docker compose -f docker-compose.development.yml exec civicpatch-frontend sh"

[tasks.devinttest]
# run = "docker compose -f docker-compose.development.yml run --rm civicpatch poetry run pytest -s -vv tests/integration/services/together_ai/test_llm.py"
# docker compose -f docker-compose.development.yml run --rm civicpatch pytest -m integration tests/integration
run = """
docker compose -f docker-compose.development.yml run --rm civicpatch xvfb-run -a pytest -m integration tests/integration/steps
"""

[tasks.devunittest]
run = """
docker compose -f docker-compose.development.yml run --rm civicpatch pytest -m unit tests/unit
"""

[tasks.scratchtest]
run = """
docker compose -f docker-compose.development.yml run --rm civicpatch pytest -vm unit tests/unit/utils/test_id_utils.py
"""


[tasks.dev]
run = """
docker compose -f docker-compose.development.yml up
"""

# Container must be up (docker compose up)
[tasks.manual]
run = """
curl -X POST http://localhost:8000/api/pipelines \
  -H "Content-Type: application/json" \
  -d '{
    "name": "Lynnwood city",
    "jurisdiction_id": "ocd-jurisdiction/country:us/state:wa/place:lynnwood/government",
    "url": "https://www.lynnwoodwa.gov"
  }'
"""
