[tasks.pipeline-run]
run = """
echo "Running with uid $(id -u):$(id -g)"
UID=$(id -u) \
GID=$(id -g) \
docker compose -f docker-compose.yml run --rm civicpatch poetry run \
  python src/cli/cli.py \
    --jurisdiction-id "{{ option(name="jurisdiction-id") }}" \
    --name "{{ option(name="name") }}" \
    --url "{{ option(name="url") }}"
"""

[tasks.test-pipeline-run-cicd]
run = """
docker compose -f docker-compose.github-actions.yml run --rm civicpatch-cicd poetry run \
  python src/cli/cli.py \
    --jurisdiction-id "ocd-jurisdiction/country:us/state:wa/place:seattle" \
    --name "Seattle city" \
    --url "https://www.seattle.gov"
"""

[tasks.pipeline-run-cicd]
