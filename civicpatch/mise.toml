[tasks.pipeline-run]
run = """
docker compose -f docker-compose.yml run --rm civicpatch poetry run \
  python src/interfaces/cli/main.py \
    --jurisdiction-ocdid "{{ option(name="jurisdiction-ocdid") }}" \
    --name "{{ option(name="name") }}" \
    --url "{{ option(name="url") }}"
"""

[tasks.test-pipeline-run-cicd]
run = """
docker compose -f docker-compose.github-actions.yml run --rm civicpatch-cicd poetry run \
  python src/interfaces/cli/main.py \
    run_pipeline \
    --jurisdiction-ocdid "ocd-jurisdiction/country:us/state:wa/place:seattle/government" \
    --name "Seattle city" \
    --url "https://www.seattle.gov" \
    --request-id "blah-example"
"""

