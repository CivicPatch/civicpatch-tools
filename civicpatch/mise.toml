"""

[tasks.jurisdiction-id-state]
run = """
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
python -c "
import sys
from utils.id_utils import parse_jurisdiction_id, state_name
jurisdiction_id = '{{ arg(name="jurisdiction_id") }}'
key = '{{ arg(name="key") }}'

parsed = parse_jurisdiction_id(jurisdiction_id)
attr = getattr(parsed, key, None)
if key == 'state':
    attr = state_name(jurisdiction_id)
else:
  attr = attr.title()

print(attr)
"
"""

[tasks.jurisdiction_id_slug]
usage = """
arg "jurisdiction_id_url" "jurisdiction id" default="ocd-jurisdiction/country:us/state:wa/place:seattle/government"
"""
run = """
docker compose -f docker-compose.development.yml run --rm civicpatch poetry run \
python -c "
from utils.id_utils import jurisdiction_id_to_slug
jurisdiction_id_url = '{{ arg(name="jurisdiction_id_url") }}'
jurisdiction_id = jurisdiction_id_to_slug(jurisdiction_id_url)
print(jurisdiction_id)
"
"""
