[env]
_.file = ".env"
[tasks.pipeline]
# TODO
run = "docker compose run --rm civicpatch poetry run python main.py pipeline --state"
[tasks.unit]
run = "docker compose run --rm civicpatch poetry run pytest -s tests/unit"
[tasks.integration]
run = "docker compose run --rm civicpatch poetry run pytest -s tests/integration"
[tasks.container]
run = "docker compose run --rm civicpatch"
[tasks.containsh]
run = "docker compose exec civicpatch bash"
[tasks.inttest]
run = "docker compose run --rm civicpatch xvfb-run -a poetry run pytest -s -vv tests/integration/services/together_ai/test_llm.py"

[tasks.dev]
run = "docker compose -f docker-compose.development.yml up"


# Container must be up (docker compose up)
[tasks.manual]
run = """
curl -X POST http://localhost:8000/api/pipeline \
  -H "Content-Type: application/json" \
  -d '{
    "state": "wa",
    "geoid": "5353545"
  }'
"""

[tasks.get_m]
run = """
curl -X GET "http://localhost:8000/api/search?state=wa&num=10"
"""

[tasks.scratch]
# run = "docker compose -f docker-compose.development.yml run --rm civicpatch poetry run pytest -s -vv tests/unit/steps/step_04_preprocess_page_content/test_filter_content.py"
run = "docker compose -f ./docker-compose.development.yml run --rm civicpatch poetry run python src/scripts/test_pipeline_step.py"

# GITHUB ACTIONS
[tasks.generate-data-comment]
run = """
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
  python src/scripts/generate_data_comment.py {{ option(name="municipality-path") }} 
"""

[tasks.generate-data-review-comment]
# Ex: /app/data/wa/municipalities/spokane/people.yml
run = """
echo "Generating data review comment..."
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
  python src/scripts/generate_data_review_comment.py {{ option(name="file") }}
"""
