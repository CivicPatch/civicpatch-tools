[tasks.jurisdiction-ocdid-state]
run = """
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
python -c "
import sys
from utils.id_utils import parse_jurisdiction_ocdid, state_name
jurisdiction_ocdid = '{{ arg(name="jurisdiction_ocdid") }}'
key = '{{ arg(name="key") }}'

parsed = parse_jurisdiction_ocdid(jurisdiction_ocdid)
attr = getattr(parsed, key, None)
if key == 'state':
    attr = state_name(jurisdiction_ocdid)
else:
  attr = attr.title()

print(attr)
"
"""

