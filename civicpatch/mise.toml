# docker compose -f docker-compose.development.yml run --rm civicpatch pytest -m integration tests/integration
run = """
docker compose -f docker-compose.development.yml run --rm civicpatch xvfb-run -a pytest -vvm integration tests/integration/services/google_gemini
"""

[tasks.unit]
run = """
docker compose -f docker-compose.development.yml run --rm civicpatch pytest -vvm unit tests/unit
"""
