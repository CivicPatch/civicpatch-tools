###############################################
## 🚀✨ GITHUB ACTIONS TASKS ✨🚀
###############################################

# The bulk of these tasks are actually run under the open-data
# repo. These commands are just left here for testing (and so
# they might not be up-to-date or complete).
[tasks.generate-data-comment]
run = """
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
  python src/scripts/generate_data_comment.py {{ option(name="jurisdiction-id") }}
"""

[tasks.test-generate-review-comment]
run = """
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
  python src/scripts/generate_review_comment.py ocd-jurisdiction/country:us/state:wa/place:seattle
"""

[tasks.generate-review-comment]
# Ex: /app/data/wa/place__spokane.yml
run = """
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
  python src/scripts/generate_review_comment.py {{ option(name="jurisdiction-id") }}
"""

[tasks.upload-images-to-cdn]
run = """
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
  python src/scripts/upload_images_to_cdn.py {{ option(name="jurisdiction-id") }}
"""

[tasks.send-costs-to-google-sheets]
run = """
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
  python src/scripts/send_costs_to_google_sheets.py {{ option(name="jurisdiction-id") }}
"""

[tasks.pipeline-run]
run = """
echo "Running with uid $(id -u):$(id -g)"
UID=$(id -u) \
GID=$(id -g) \
docker compose -f docker-compose.yml run --rm civicpatch poetry run \
  python src/cli/cli.py \
    --jurisdiction-id "{{ option(name="jurisdiction-id") }}" \
    --name "{{ option(name="name") }}" \
    --url "{{ option(name="url") }}"
"""

[tasks.test-pipeline-run-cicd]
run = """
docker compose -f docker-compose.github-actions.yml run --rm civicpatch-cicd poetry run \
  python src/cli/cli.py \
    --jurisdiction-id "ocd-jurisdiction/country:us/state:wa/place:seattle" \
    --name "Seattle city" \
    --url "https://www.seattle.gov"
"""

[tasks.pipeline-run-cicd]
run = """
docker compose -f docker-compose.github-actions.yml run --rm civicpatch-cicd poetry run \
  python src/cli/cli.py \
    run_pipeline \
    --jurisdiction-id "{{ option(name="jurisdiction-id") }}" \
    --name "{{ option(name="name") }}" \
    --url "{{ option(name="url") }}"
"""

[tasks.get-juds]
run = """
docker compose -f docker-compose.github-actions.yml run --rm civicpatch-cicd poetry run \
  python src/cli/cli.py \
    get_juds \
    --num-jurisdictions "{{ option(name="num-jurisdictions") }}" \
    --state "{{ option(name="state") }}"
"""

[tasks.cli-test]
run = """
mise pipeline-run \
  --jurisdiction-id "ocd-jurisdiction/country:us/state:wa/place:seattle" \
  --name "Seattle city" \
  --url "https://www.seattle.gov"
"""

[tasks.jurisdiction-id-state]
run = """
docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
python -c "
import sys
from utils.id_utils import parse_jurisdiction_id, state_name
jurisdiction_id = '{{ arg(name="jurisdiction_id") }}'
key = '{{ arg(name="key") }}'

parsed = parse_jurisdiction_id(jurisdiction_id)
attr = getattr(parsed, key, None)
if key == 'state':
    attr = state_name(jurisdiction_id)
else:
  attr = attr.title()

print(attr)
"
"""

