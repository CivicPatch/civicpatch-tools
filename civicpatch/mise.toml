#docker compose -f docker-compose.slim.yml run --rm civicpatch-slim poetry run \
#  python src/scripts/upload_images_to_cdn.py {{ option(name="municipality-path") }}
#"""
run = """
docker compose -f docker-compose.development.yml run --rm civicpatch poetry run \
