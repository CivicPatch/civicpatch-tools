# New York ground truth for the state-offices skill's scoring step. Only offices New York's config collects, and
# only holders a source names as that office. A chair, deputy mayor or deputy supervisor is chosen by the members:
# method A. Read 2026-11-20. Kenmore village (expired certificate), Onondaga County (fetch failed) were tried and
# replaced by Fairport village and Chemung County.

cities:
  ocd-jurisdiction/country:us/state:ny/place:syracuse/government:
    - office: mayor
      holders: [Sharon F. Owens]
      method: E
      source: "https://www.syr.gov/Government/City-Elected-Officials"
      as_of: "2026-11-20"
    - office: council-member
      holders: [Chol Majok, Rasheada Caldwell, Hanah Ehrenreich, Helen Hudson, Marino L. Nave, Donna Moore,
                Corey J. Williams, Patrona Jones-Rowser, Jimmy Monto]
      method: E
      source: "https://www.syr.gov/Government/City-Elected-Officials"
      as_of: "2026-11-20"
    # The council president is elected citywide to that office (term 2026 to 2029 on the page), so E, unlike a
    # chair the members choose. 4 at-large + 5 district + president = 10.
    - office: council-president
      holders: [Rita Paniagua]
      method: E
      source: "https://www.syr.gov/Departments/Common-Council/Councilors/Common-Council-President"
      as_of: "2026-11-20"
    # not confirmed: whether Syracuse has an appointed city administrator; the org chart is a PDF without text.

