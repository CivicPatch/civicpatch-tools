services:
  api_civicpatch_org:
    env_file: .env
    build:
      context: ..
      dockerfile: api.civicpatch.org/Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
      - ../shared:/app/src/shared:ro
    networks:
      - civicpatch_net
    depends_on:
      - api_civicpatch_org_db

  api_civicpatch_org_db:
    image: postgis/postgis:17-3.5
    restart: always
    environment:
      POSTGRES_USER: civicpatch
      POSTGRES_PASSWORD: development_password
      POSTGRES_DB: development_db
    volumes:
      - crudder_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:6000:5432"
    networks:
      - civicpatch_net
volumes:
  crudder_pgdata:

networks:
  civicpatch_net:
    driver: bridge
