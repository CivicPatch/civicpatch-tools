services:
  api_civicpatch_org:
    container_name: api_civicpatch_org
    environment:
      # Required
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET}
      GITHUB_APP_PRIVATE_KEY_BASE64: ${GITHUB_APP_PRIVATE_KEY_BASE64}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID}

      # Defaults OK
      CIVICPATCH_API_DB_PASSWORD: ${CIVICPATCH_API_DB_PASSWORD:-development_password}
      CIVICPATCH_API_DB_URL: ${CIVICPATCH_API_DB_URL:-postgres://civicpatch:development_password@api_civicpatch_org_db:5432/development_db}

      COOKIE_INSTANCE_URL: ".civicpatch.org"
      INSTANCE_URL: "http://localhost:8001"
      OPEN_DATA_REPO_URL: "https://api.github.com/repos/CivicPatch/open-data" # Todo: use test data & server
      MAINTAINER_EMAIL: "michelle@civicpatch.org"

      REDIS_HOST: api_civicpatch_org_redis
      JWT_SECRET_KEY: jwt-secret-key-here
      DATABASE_HASH_KEY: database-hash-key
      SERVICE_API_KEY: "service-api-key"

      # Optional; only needed for syncing github webhooks
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}

      # Optional; only for scraping
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID}
      GOOGLE_SHEETS_PRIVATE_KEY_BASE64: ${GOOGLE_SHEETS_PRIVATE_KEY_BASE64}
      GOOGLE_SHEETS_CLIENT_EMAIL: ${GOOGLE_SHEETS_CLIENT_EMAIL}
      GOOGLE_SHEETS_TOKEN_URI: ${GOOGLE_SHEETS_TOKEN_URI}

      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
    build:
      context: ..
      dockerfile: api.civicpatch.org/Dockerfile
      target: development
    # restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
      - ../shared/src/shared:/app/src/shared:ro
    networks:
      - civicpatch_net
    depends_on:
      - api_civicpatch_org_db

  api_civicpatch_org_db:
    image: postgis/postgis:17-3.5
    # restart: always
    environment:
      POSTGRES_USER: civicpatch
      POSTGRES_PASSWORD: development_password
      POSTGRES_DB: development_db
    volumes:
      - api_civicpatch_org_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:6000:5432"
    networks:
      - civicpatch_net

  api_civicpatch_org_redis:
    image: redis:alpine
    #expose:
    #  - "6379"
    ports:
      - '6379:6379'
    networks:
      - civicpatch_net

volumes:
  api_civicpatch_org_db_data:
  #test_pgdata:

networks:
  civicpatch_net:
    driver: bridge
  civicpatch_test_net:
    driver: bridge
