<h2>User Details</h2>
<p>
    <strong>provider:</strong> github<br />
    <strong>provider_user_id:</strong> {{user.id}}<br />
    <strong>user_email:</strong> {{ user_details.user_email }}
</p>

<form method="post" action="/api/internal/user" style="margin-bottom: 2em">
    <label for="server_url"><strong>CivicPatch Server URL</strong></label>
    <input
        type="url"
        id="server_url"
        name="server_url"
        value="{{user_details.server_url or ''}}"
        required
    />
    <!-- Include a hidden field so the server can detect where the request originated -->
    <input type="hidden" name="x_requested_with" id="x_requested_with" value="crudder_ui" />
    <!-- Signed CSRF token injected from cookie (server-rendered) -->
    <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token', '') }}" />

    <button type="submit" class="secondary">Update Server Info</button>
</form>
