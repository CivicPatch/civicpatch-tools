[tools]
poetry = { version="latest", pyproject="{{ config_root }}/pyproject.toml" }
python = "3.12" # must be after poetry so the poetry bin is first in PATH

[env]
# _.file = ".deployment.env"
_.file = ".env"
PYTHONPATH = "./src"
POETRY_VIRTUALENVS_IN_PROJECT = "true"


[tasks.dev]
run = """
docker compose run --rm api_civicpatch_org 
"""

[tasks.containsh]
run = "docker compose exec api.civicpatch.org bash"

[tasks.deploy_api_civicpatch_org]
run = "python scripts/deploy.py"

[tasks.generate-url]
run = "docker compose run --rm api.civicpatch.org poetry run python src/scripts/one-off-generate-file-url.py request_fa6157f0-c3bf-4432-b3b3-f7c8c8b2905e_wa_5336045.zip"

[tasks.trigger-github]
run = "docker compose run --rm api.civiccpatch.org poetry run pytest -vv -s tests/test_github_service.py"

[tasks.process-zip]
run = "docker compose run --rm api.civicpatch.org poetry run pytest -vv -s tests/test_cloudflare.py"

# New task to test R2 credentials
[tasks.test-r2]
description = "Test Cloudflare R2 credentials by uploading a small test file"
run = """
docker compose run --rm api.civicpatch.org poetry run python -c '
import boto3, os
from botocore.client import Config
from io import BytesIO

client = boto3.client("s3",
    endpoint_url=os.environ["STORAGE_ENDPOINT"],
    aws_access_key_id=os.environ["STORAGE_ACCESS_KEY_ID"],
    aws_secret_access_key=os.environ["STORAGE_SECRET_ACCESS_KEY"],
    region_name="auto",
    config=Config(signature_version="s3v4", s3={"addressing_style": "virtual"})
)

# Create file-like object
test_data = BytesIO(b"test content")

try:
    client.upload_fileobj(
        test_data,
        "crudder",
        "test.txt"
    )
    print("✓ Successfully uploaded test file")
    # client.delete_object(Bucket="civicpatch", Key="test.txt")
    print("✓ Successfully cleaned up test file")
except Exception as e:
    print(f"✗ Error: {str(e)}")
finally:
    test_data.close()
'
"""

[tasks.od_sync]
run = """
    curl -X POST "http://localhost:8001/api/admin/od_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: $CRUDDER_SHARED_TOKEN"
"""

[tasks.od_sync_prod]
run = """
    curl -X POST "https://api.civicpatch.org/api/admin/od_sync" \
      -H "Content-Type: application/json" \
      -H "Authorization: $PROD_CRUDDER_SHARED_TOKEN"
"""

[tasks.query_jurisdictions]
run = """
    curl -X GET "https://api.civicpatch.org/api/v1/jurisdictions/available?num_jurisdictions=10&state=nj" \
      -H "Content-Type: application/json" \
      -H "Authorization: $PROD_CRUDDER_SHARED_TOKEN"
"""


[tasks.get_state]
run = """
    curl -X GET "http://localhost:8001/api/v1/jurisdictions/states" \
      -H "Content-Type: application/json" \
      -H "Authorization: $CRUDDER_SHARED_TOKEN"
"""

[tasks.search_jurisdictions]
run = """
    curl -X GET "http://localhost:8001/api/v1/jurisdictions/wa/search?limit=2" \
      -H "Content-Type: application/json" \
      -H "Authorization: $CRUDDER_SHARED_TOKEN"
"""

[tasks.create_job]
run = """
    curl -X POST "http://localhost:8001/api/v1/jobs/people" \
      -H "Content-Type: application/json" \
      -H "Authorization: $CRUDDER_SHARED_TOKEN" \
      -d '{"jurisdiction_ocdid": "ocd-jurisdiction/country:us/state:wa/place:seattle", "url": "https://www.seattle.gov/"}'
"""

[tasks.get_job_status]
run = """
    curl -X GET "http://localhost:8001/api/v1/jobs/people/2026-01-13-9fd0/status" \
      -H "Content-Type: application/json" \
      -H "Authorization: $CRUDDER_SHARED_TOKEN" 
"""

[tasks.get_job]
run = """
    curl -X GET "http://localhost:8001/api/v1/jobs/people/2026-01-13-9fd0" \
      -H "Content-Type: application/json" \
      -H "Authorization: $CRUDDER_SHARED_TOKEN" 
"""

[tasks.get_people]
run = """
    curl -X GET "http://localhost:8001/api/v1/people?jurisdiction_ocdid=ocd-jurisdiction%2Fcountry%3Aus%2Fstate%3Awa%2Fplace%3Aseattle%2Fgovernment" \
    -H "Content-Type: application/json" \
    -H "Authorization: $CRUDDER_SHARED_TOKEN"
"""

###################################################
## 🚀✨ DATABASE COMMANDS (for development) ✨🚀 ##
###################################################

[tasks.migrate_up]
run = """
docker compose run --rm api.civicpatch.org \
    python database_operations/migrate.py up
"""

[tasks.migrate_down]
run = """
docker compose run --rm api.civicpatch.org \
    python database_operations/migrate.py down
"""
