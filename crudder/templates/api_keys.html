<!DOCTYPE html>
<html lang="en">
<head>
    <title>API Keys - Crudder</title>
    <link href="{{ url_for('static', path='/pico.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet">
</head>
<body>
    <main class="container">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <h1>API Keys</h1>
            <button class="contrast" style="margin-left: auto;" onclick="createApiKey()">
                + Create New Key
            </button>
        </div>

        <hr />

        <article id="api-keys-list">
            {% if api_keys %}
                {% for key in api_keys %}
                <div class="grid">
                    <div role="group">
                        <strong>***************{{ key.suffix}}</strong>
                        <small>Created: {{ key.created_at.strftime('%Y-%m-%d') }}</small>
                        <button class="secondary outline" 
                                onclick="revokeKey('{{ key.id }}')"
                                data-tooltip="This action cannot be undone">
                            Revoke
                        </button>
                    </div>
                </div>
                <hr>
                {% endfor %}
            {% else %}
                <article>
                    <p>No API keys found. Create one to get started.</p>
                </article>
            {% endif %}
        </article>
    </main>

    <script>
        async function revokeKey(keyId) {
            if (!confirm('Are you sure you want to revoke this API key?')) {
                return;
            }
            try {
                const response = await fetch(`/api-keys/${keyId}`, {
                    method: 'DELETE',
                });
                if (response.ok) {
                    window.location.reload();
                }
            } catch (error) {
                console.error('Error revoking key:', error);
            }
        }

        async function createApiKey() {
            try {
                const response = await fetch('/api-keys', {
                    method: 'POST',
                });
                if (response.ok) {
                    window.location.reload();
                }
            } catch (error) {
                console.error('Error creating key:', error);
            }
        }
    </script>
</body>
</html>
