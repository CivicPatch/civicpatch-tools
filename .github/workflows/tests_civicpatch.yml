name: 0. Run civicpatch Tests
on:
  pull_request:
    branches:
      - main
    paths:
      - "civicpatch/**"
  push:
    branches:
      - main
    paths:
      - "civicpatch/**"
permissions:
  contents: read

jobs:
  run-civicpatch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run civicpatch tests
        run: |
          uv run pytest civicpatch/tests/unit
