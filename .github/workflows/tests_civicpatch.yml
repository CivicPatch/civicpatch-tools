name: 0. Run pipelines Tests
on:
  pull_request:
    branches:
      - main
    paths:
      - "pipelines/**"
  push:
    branches:
      - main
    paths:
      - "pipelines/**"
permissions:
  contents: read

jobs:
  run-pipelines-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run pipelines tests
        run: |
          uv run pytest pipelines/tests/unit
