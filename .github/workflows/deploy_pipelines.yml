name: 0. 🤖 - Docker - Build and Push

on:
  push:
    branches:
      - main
    paths:
      - "pipelines/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/tests_pipelines.yml

  get-date:
    runs-on: ubuntu-latest
    outputs:
      date-tag: ${{ steps.date.outputs.date-tag }}
    steps:
      - name: Get Current Date
        id: date
        run: echo "date-tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

  deploy-pipelines:
    needs: [tests, get-date]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (github actions)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./pipelines/Dockerfile.github-actions
          push: true
          tags: |
            ghcr.io/civicpatch/pipelines:latest
            ghcr.io/civicpatch/pipelines:${{ needs.get-date.outputs.date-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
