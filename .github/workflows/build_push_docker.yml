name: 0. 🤖 - Docker - Build and Push

on:
  push:
    branches:
      - main
    paths:
      - "civicpatch/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
        
      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run civicpatch tests
        run: |
          uv run pytest civicpatch/tests/unit

      - name: Run shared tests
        run: |
          uv run pytest shared/tests

  get-date:
    runs-on: ubuntu-latest
    outputs:
      date-tag: ${{ steps.date.outputs.date-tag }}
    steps:
      - name: Get Current Date
        id: date
        run: echo "date-tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

  build-slim:
    needs: get-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Really not that slim; it is 2GB
      # TODO: make it smaller
      # Or get rid of it altogether
      - name: Build and push (slim)
        if: ${{ github.ref_name == 'main' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./civicpatch/Dockerfile
          push: true
          tags: |
            ghcr.io/civicpatch/civicpatch-slim:latest
            ghcr.io/civicpatch/civicpatch-slim:${{ needs.get-date.outputs.date-tag }}
          target: image-base
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-production:
    needs: get-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Use this image when self hosting, else there are issues
      # with permissions in running this image in GitHub Actions
      - name: Build and push (production)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./civicpatch/Dockerfile
          push: true
          tags: |
            ghcr.io/civicpatch/civicpatch:latest
            ghcr.io/civicpatch/civicpatch:${{ needs.get-date.outputs.date-tag }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-production-github-actions:
    needs: get-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (github actions)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./civicpatch/Dockerfile.github-actions
          push: true
          tags: |
            ghcr.io/civicpatch/civicpatch-github-actions:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
