name: 0. Run Tests on Pull Request

on:
  pull_request:
    branches:
      - main
    paths:
      - "civicpatch/**"

permissions:
  contents: read
  
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run unit tests
        working-directory: ./civicpatch
        run: |
          docker compose -f docker-compose.development.yml run --rm civicpatch pytest -m unit tests/unit