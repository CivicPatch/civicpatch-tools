name: 0. Run worker Tests
on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/**"
      - "shared/**"
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run pyright
        run: uv run pyright
        working-directory: worker
