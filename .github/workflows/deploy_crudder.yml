name: Build & Deploy Crudder

on:
  push:
    branches:
      - main
    paths:
      - 'crudder/**'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}      
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Current Date
        id: date
        run: echo "date-tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build and push (crudder)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crudder/Dockerfile
          push: true
          tags: |
            ghcr.io/civicpatch/crudder:latest
            ghcr.io/civicpatch/crudder:${{ steps.date.outputs.date-tag }}

      - name: Deploy Crudder to production
        env:
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ github.actor }}
          REMOTELAB_WORKFLOW_TOKEN: ${{ secrets.CRUDDER_REMOTELAB_WORKFLOW_TOKEN }}
        run:
          ./crudder/scripts/deploy.py
