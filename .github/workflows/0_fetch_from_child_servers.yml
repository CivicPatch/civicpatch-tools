name: Fetch from child servers
on:
  schedule:
    - cron: '0 13 * * *'  # 5 AM PST
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Specific server to run (leave empty for all)'
        required: false
        type: string

env:
  DEFAULT_SERVERS: '["LOCAL_SERVER_A"]'

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      matrix-servers: ${{ steps.set-matrix-servers.outputs.matrix_servers }}
    steps:
      - name: Set matrix servers
        id: set-matrix-servers
        run: |
          if [ -n "${{ github.event.inputs.server_name }}" ]; then
            echo "matrix_servers=[\"${{ github.event.inputs.server_name }}\"]" >> $GITHUB_OUTPUT
          else
            echo "matrix_servers=${{ env.DEFAULT_SERVERS }}" >> $GITHUB_OUTPUT
          fi
        env:
          DEFAULT_SERVERS: ${{ env.DEFAULT_SERVERS }}

  process_data:
    runs-on: ubuntu-latest
    needs: fetch_data
    name: Process data from ${{ matrix.server }}
    strategy:
      matrix:
        server: ${{ fromJson(needs.fetch_data.outputs.matrix-servers) }}
    env:
      SERVER_TOKEN: ${{ secrets[format('{0}_TOKEN', matrix.server)] }}
      SERVER_URL: ${{ vars[format('{0}_URL', matrix.server)] }}
    steps:
      - uses: actions/checkout@v5

      - name: Request data from child server
        id: fetch
        run: |
          # Request new data
          response=$(curl -X POST \
            -H "Authorization: Bearer ${{ env.SERVER_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ env.SERVER_URL }}/github-actions")
          
          # Extract request_id and data
          request_id=$(echo $response | jq -r '.request_id')
          echo "request_id=$request_id" >> $GITHUB_OUTPUT
          
          # Keep track of files we're adding
          tmp_dir="data/tmp_${request_id}"
          mkdir -p "$tmp_dir"
          echo "$response" | jq -r '.data' | base64 -d | tar xz -C "$tmp_dir"
          
          if [ ! "$(ls -A $tmp_dir)" ]; then
            echo "No new data to process"
            rm -rf "$tmp_dir"
            exit 0
          fi

          # Create list of new files before copying
          find "$tmp_dir" -name "*.yml" -type f > "/tmp/new_files_${request_id}.txt"
          
          mkdir -p civicpatch
          cp -R "$tmp_dir"/* civicpatch/
          rm -rf "$tmp_dir"

      - name: Process YAML data
        if: steps.fetch.outputs.request_id != ''
        run: |
          # Only validate new files from this request
          while IFS= read -r orig_file; do
            # Convert tmp path to civicpatch path
            file="${orig_file/data\/tmp_${{ steps.fetch.outputs.request_id }}/civicpatch}"
            
            if ! yq eval "$file" > /dev/null 2>&1; then
              curl -X POST \
                -H "Authorization: Bearer ${{ env.SERVER_TOKEN }}" \
                -H "Content-Type: application/json" \
                "${{ env.SERVER_URL }}/github-actions/${{ steps.fetch.outputs.request_id }}" \
                -d "{\"status\": \"failed\", \"error\": \"Invalid YAML in $(basename $file)\"}"
              exit 1
            fi
          done < "/tmp/new_files_${{ steps.fetch.outputs.request_id }}.txt"

      - name: Create Pull Request
        if: success() && steps.fetch.outputs.request_id != ''
        run: |
          # Configure git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Create branch with request_id
          branch_name="update-${{ matrix.server }}-${{ steps.fetch.outputs.request_id }}"
          git checkout -b "$branch_name"
          
          # Stage and commit changes
          git add civicpatch/
          git commit -m "Update data from ${{ matrix.server }}

          Request ID: ${{ steps.fetch.outputs.request_id }}
          Server: ${{ matrix.server }}"
          
          # Push branch
          git push origin "$branch_name"
          
          # Create PR using GitHub CLI
          gh pr create \
            --title "Update from ${{ matrix.server }}" \
            --body "Data update from ${{ matrix.server }}

            - Request ID: ${{ steps.fetch.outputs.request_id }}
            - Source: ${{ matrix.server }}
            - Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            --base main \
            --head "$branch_name"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TODO: Additional two posts
      # 1. People table
      # 2. Agreement Score & Detailed disagreements table

      - name: Update server with success/failure
        if: always() && steps.fetch.outputs.request_id != ''
        run: |
          status="${{ job.status }}"
          curl -X POST \
            -H "Authorization: Bearer ${{ env.SERVER_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ env.SERVER_URL }}/github-actions/${{ steps.fetch.outputs.request_id }}" \
            -d "{\"status\": \"${status,,}\"}"
