name: Deploy worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: ghcr.io/civicpatch/civicpatch_worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and push (temporal server)
        uses: docker/build-push-action@v7
        with:
          context: ./worker/temporal
          file: ./worker/temporal/Dockerfile.temporal
          push: true
          tags: ghcr.io/civicpatch/civicpatch_temporal:latest
          cache-from: type=gha,scope=temporal-server
          cache-to: type=gha,mode=max,scope=temporal-server

      - name: Build and push (temporal admin-tools)
        uses: docker/build-push-action@v7
        with:
          context: ./worker/temporal
          file: ./worker/temporal/Dockerfile.admin-tools
          push: true
          tags: ghcr.io/civicpatch/civicpatch_temporal_admin_tools:latest
          cache-from: type=gha,scope=temporal-admin-tools
          cache-to: type=gha,mode=max,scope=temporal-admin-tools

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_BOT_PIPELINE_APP_ID }}
          private-key: ${{ secrets.GH_APP_BOT_PIPELINE_PRIVATE_KEY }}
          owner: CivicPatch
          repositories: infrastructure

      - name: Trigger deploy workflow
        run: |
          curl -X POST --fail --show-error \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/CivicPatch/infrastructure/actions/workflows/deploy-civicpatch-org.yml/dispatches \
            -d '{"ref":"main"}'
