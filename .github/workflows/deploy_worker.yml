name: Deploy worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: ghcr.io/civicpatch/civicpatch_worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_BOT_PIPELINE_APP_ID }}
          private-key: ${{ secrets.GH_APP_BOT_PIPELINE_PRIVATE_KEY }}
          owner: CivicPatch
          repositories: infrastructure

      - name: Trigger deploy workflow
        run: |
          curl -X POST --fail --show-error \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/CivicPatch/infrastructure/actions/workflows/deploy-api-civicpatch-org.yml/dispatches \
            -d '{"ref":"main"}'
