name: Build & Deploy api.civicpatch.org

on:
  push:
    branches:
      - main
    paths:
      - "api.civicpatch.org/**"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Login to  GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Current Date
        id: date
        run: echo "date-tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build and push (api.civicpatch.org)
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./api.civicpatch.org/Dockerfile
          push: true
          tags: |
            ghcr.io/civicpatch/civicpatch:latest
            ghcr.io/civicpatch/civicpatch:${{ steps.date.outputs.date-tag }}

      - name: Deploy api.civicpatch.org to production
        env:
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ github.actor }}
          REMOTELAB_WORKFLOW_TOKEN: ${{ secrets.CRUDDER_REMOTELAB_WORKFLOW_TOKEN }}
        run: ./api.civicpatch.org/scripts/deploy.py
