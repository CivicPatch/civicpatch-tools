name: Deploy civicpatch.org

on:
  push:
    branches:
      - main
    paths:
      - "civicpatch.org/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/tests_civicpatch_org.yml

  get-date:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.date.outputs.image-tag }}
    steps:
      - name: Compute image tag (date + short SHA)
        id: date
        run: echo "image-tag=$(date +'%Y-%m-%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: [tests, get-date]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (civicpatch.org)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./civicpatch.org/Dockerfile
          push: true
          target: production
          tags: |
            ghcr.io/civicpatch/civicpatch-org:latest
            ghcr.io/civicpatch/civicpatch-org:${{ needs.get-date.outputs.image-tag }}
          cache-from: |
            type=gha,scope=api-frontend
            type=gha,scope=api-python
          cache-to: |
            type=gha,scope=api-frontend,mode=max
            type=gha,scope=api-python,mode=max

  deploy:
    needs: [build, get-date]
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_BOT_PIPELINE_APP_ID }}
          private-key: ${{ secrets.GH_APP_BOT_PIPELINE_PRIVATE_KEY }}
          owner: CivicPatch
          repositories: infrastructure

      - name: Trigger deploy workflow
        run: |
          curl -X POST --fail --show-error \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/CivicPatch/infrastructure/actions/workflows/deploy-civicpatch-org.yml/dispatches \
            -d '{"ref":"main","inputs":{"image_tag":"${{ needs.get-date.outputs.image-tag }}"}}'
