name: Deploy civicpatch.org

on:
  push:
    branches:
      - main
    paths:
      - "civicpatch/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run civicpatch tests
        run: |
          uv run pytest civicpatch/tests/unit

      - name: Run shared tests
        run: |
          uv run pytest shared/tests

  get-date:
    runs-on: ubuntu-latest
    outputs:
      date-tag: ${{ steps.date.outputs.date-tag }}
    steps:
      - name: Get Current Date
        id: date
        run: echo "date-tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

  build-frontend:
    needs: [run-tests, get-date]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (production)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./civicpatch/Dockerfile
          push: true
          tags: |
            ghcr.io/civicpatch/civicpatch:latest
            ghcr.io/civicpatch/civicpatch:${{ needs.get-date.outputs.date-tag }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frontend workflow
        run: |
          curl -X POST --fail --show-error \
            -H "Authorization: Bearer ${{ secrets.GH_APP_BOT_PIPELINE_APP_ID }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/CivicPatch/infrastructure/actions/workflows/deploy-civicpatch-org.yml/dispatches \
            -d '{"ref":"main"}'
