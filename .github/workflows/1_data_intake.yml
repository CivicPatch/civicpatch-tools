name: 1. Data Intake
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'CivicPatch Server URL (e.g. https://civicpatch.example.com)'
        required: true
      user_email:
        description: 'Email associated with your CivicPatch account'
        required: true
      request_id:
        description: 'Unique request ID for this data intake (e.g. UUID)'
        required: true
      state:
        description: 'State' 
        required: true
      municipality_name:
        description: 'Municipality Name'
        required: true
      geoid:
        description: 'Geographic ID'
        required: true
      zip_file_url:
        description: 'Presigned URL of the ZIP file containing YAML data'
        required: true

jobs:
  payload_intake:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download ZIP file
        run: |
          curl -L "${{ github.event.inputs.zip_file_url }}" -o /tmp/payload.zip

      - name: Generate GitHub Pipeline Token
        id: generate-pipeline-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_BOT_PIPELINE_APP_ID }}
          private-key: ${{ secrets.GH_APP_BOT_PIPELINE_PRIVATE_KEY }}

      - name: Unzip data into root project directory
        run: |
          unzip -o /tmp/payload.zip -d .
          ls -l 
          ls -l data
          ls -l data_source
          git status

      - name: Get branch name from zip_file_url
        id: extract_branch
        run: |
          ZIP_FILE=$(basename "${{ github.event.inputs.zip_file_url }}")
          BRANCH_NAME="${ZIP_FILE%%.zip*}"  # Remove everything starting from .zip
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create a PR
        env:
          GITHUB_USERNAME: civic-patch-pipeline-bot
          GITHUB_TOKEN: ${{ steps.generate-pipeline-token.outputs.token }}
          SERVER_URL: ${{ github.event.inputs.server_url }}
          USER_EMAIL: ${{ github.event.inputs.user_email }}
        run: |
          git config --global user.name "$GITHUB_USERNAME"
          git config --global user.email "civicpatch-tools@civicpatch.org"
          git checkout -B ${{ steps.extract_branch.outputs.branch_name }}
          git add .
          git commit -m "Add municipal officials for ${{ github.event.inputs.state }} - ${{ github.event.inputs.geoid }} by ${{ github.event.inputs.user_email }}"
          git push -u origin ${{ steps.extract_branch.outputs.branch_name }} 

          echo ${{ github.actor }}
          
          gh pr create \
            --title "Data intake for ${{ github.event.inputs.state }} - ${{ github.event.inputs.municipality_name }} by ${{ github.event.inputs.user_email }}" \
            --body "Automated data intake for request ID: ${{ github.event.inputs.request_id }}. Please review the data before merging." \
            --base main

      # TODO: run script to generate people table
      # TOOD: run script to generate disagreements table