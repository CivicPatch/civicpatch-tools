name: 0. Run pipelines Tests
on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - "pipelines/**"
      - "shared/**"
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run pyright
        run: uv run pyright
        working-directory: pipelines

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run pipelines tests
        # Same working directory as `mise run tpipes` and as the typecheck job above. The eval
        # tests resolve fixtures relative to cwd, so from the repo root 39 of them fail on
        # files that are present.
        working-directory: pipelines
        run: uv run pytest tests/unit
