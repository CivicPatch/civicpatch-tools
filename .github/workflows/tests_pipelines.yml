name: 0. Run pipelines Tests
on:
  workflow_call:
  pull_request:
    branches:
      - main
    paths:
      - "pipelines/**"
      - "shared/**"
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run pyright
        run: uv run pyright
        working-directory: pipelines

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run pipelines tests
        run: uv run pytest pipelines/tests/unit
