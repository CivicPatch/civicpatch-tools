name: E2E civicpatch.org

on:
  push:
    branches:
      - main
    paths:
      - "civicpatch.org/**"
      - "e2e/**"
      - "shared/**"
      - "docker-compose.e2e.yml"
  pull_request:
    branches:
      - main
    paths:
      - "civicpatch.org/**"
      - "e2e/**"
      - "shared/**"
      - "docker-compose.e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build app image
        run: docker compose -f docker-compose.e2e.yml build civicpatch-org-e2e

      - name: Run e2e tests
        run: |
          docker compose -f docker-compose.e2e.yml up \
            --exit-code-from playwright \
            --abort-on-container-exit

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans

      # `behaviour-results/` is this suite's `outputDir` — the default `test-results/` is left
      # root-owned by the dockerised run, so the config moved off it. The reporter is `list`, so
      # there is no HTML report to collect: what a failure leaves here is its trace and screenshot.
      - name: Upload Playwright failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: e2e/behaviour-results/
          if-no-files-found: ignore
          retention-days: 7
