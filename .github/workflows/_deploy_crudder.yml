name: Deploy Crudder

on:
  push:
    branches:
      - main
    paths:
      - 'crudder/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and deploy crudder service to production
        env:
          DOCKER_PASSWORD: ${{ secrets.CRUDDER_DOCKER_DEPLOY_TOKEN }}
          REMOTELAB_WORKFLOW_TOKEN: ${{ secrets.CRUDDER_REMOTELAB_WORKFLOW_TOKEN }}
        run:
          ./crudder/scripts/build_and_deploy.py
