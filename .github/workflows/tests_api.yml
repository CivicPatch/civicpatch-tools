name: 0. Run civicpatch.org Tests
on:
  pull_request:
    branches:
      - main
    paths:
      - "civicpatch.org/**"
      - "shared/**"
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run pyright
        run: uv run pyright
        working-directory: civicpatch.org

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run civicpatch.org unit tests
        run: uv run pytest civicpatch.org/tests
