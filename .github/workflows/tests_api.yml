name: 0. Run api.civicpatch.org Tests
on:
  pull_request:
    branches:
      - main
    paths:
      - "api.civicpatch.org/**"
permissions:
  contents: read

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run shared unit tests
        run: |
          uv run pytest api.civicpatch.org/tests
