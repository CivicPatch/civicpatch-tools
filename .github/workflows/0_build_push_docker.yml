name: 0. 🤖 - Docker - Build and Push

on:
  push:
    branches:
      - main
    paths:
      - "civicpatch/**"
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name for the build (default: main)'
        required: true
      docker_tag:
        description: 'Docker tag to use' 
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch_name || 'main' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Current Date
        id: date
        run: echo "date-tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Really not that slim; it is 2GB
      # TODO: make it smaller
      - name: Build and push (slim) with custom tag
        if: ${{ github.event.inputs.docker_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: civicpatch/Dockerfile
          push: true
          tags: ghcr.io/civicpatch/civicpatch-slim:${{ github.event.inputs.docker_tag }}
          target: image-base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (slim) with default tags
        if: ${{ !github.event.inputs.docker_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: civicpatch/Dockerfile
          push: true
          tags: |
            ghcr.io/civicpatch/civicpatch-slim:latest
            ghcr.io/civicpatch/civicpatch-slim:${{ steps.date.outputs.date-tag }}
          target: image-base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (production) with custom tag
        if: ${{ github.event.inputs.docker_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: civicpatch/Dockerfile
          push: true
          tags: ghcr.io/civicpatch/civicpatch:${{ github.event.inputs.docker_tag }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (production) with default tags
        if: ${{ !github.event.inputs.docker_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: civicpatch/Dockerfile
          push: true
          tags: |
            ghcr.io/civicpatch/civicpatch:latest
            ghcr.io/civicpatch/civicpatch:${{ steps.date.outputs.date-tag }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max
