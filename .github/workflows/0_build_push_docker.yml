name: 0. 🤖 - Docker - Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'civicpatch/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get Current Date
        id: date
        run: echo "::set-output name=DATE_TAG::$(date +'%Y-%m-%d')"

      # Really not that slim; it is 2GB
      # TODO: make it smaller
      - name: Build and push (slim)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: civicpatch/Dockerfile
          push: true
          tags: |
            ghcr.io/civicpatch/civicpatch-slim:latest
            ghcr.io/civicpatch/civicpatch-slim:${{ steps.date.outputs.DATE_TAG }}
          target: image-base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # MASSIVE image; 8GB+ 
      - name: Build and push (production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: civicpatch/Dockerfile
          push: true
          tags: |
            ghcr.io/civicpatch/civicpatch:latest
            ghcr.io/civicpatch/civicpatch:${{ steps.date.outputs.DATE_TAG }}
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max