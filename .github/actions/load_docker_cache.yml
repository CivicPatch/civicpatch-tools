name: load docker caceh

runs:
  using: 'composite'
  steps:
    - name: Compute Docker cache key
      id: docker-key
      run: echo "key=docker-cache-${{ hashFiles('Dockerfile', '**/*.rb') }}" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      id: cache
      with:
        path: docker-latest.tar
        key: ${{ steps.docker-key.outputs.key }}
        restore-keys: |
          docker-cache-

    - name: Load Docker image from cache
      if: steps.cache.outputs.cache-hit == 'true'
      run: docker load -i docker-latest.tar

    - name: Pull latest image if not cached
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        docker pull ghcr.io/civicpatch/civpatch:latest
        docker save ghcr.io/civicpatch/civpatch:latest -o docker-latest.tar

